# Self-contained on purpose (no `workspace = true` inheritance): an auditor
# must be able to build and test the verifier from `sdk/verifier/` alone,
# without franken_node's crates. CI proves it (verifier-sdk-standalone.yml).
# Keep version/edition/license in step with the root [workspace.package].
[package]
name = "frankenengine-verifier-sdk"
version = "0.1.0"
edition = "2024"
description = "Verifier SDK for replaying bundles, checking canonical hashes, and verifying Ed25519 signatures"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"

[features]
fuzz = ["arbitrary"]
test-support = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1.1"
sha2 = "0.11.0"
hex = "0.4.3"
subtle = "2.6.1"
chrono = { version = "0.4.40", default-features = false, features = ["alloc", "clock", "std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
tree-sitter = "0.26.8"
tree-sitter-javascript = "0.25.0"
arbitrary = { version = "1.3", optional = true, features = ["derive"] }

