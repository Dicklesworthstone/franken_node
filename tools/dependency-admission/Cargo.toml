# Compile the actual product source without the unrelated sibling workspaces.
[package]
name = "franken-native-dependency-admission-tests"
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"

[workspace]

[lib]
name = "franken_dependency_admission_schema"
path = "../../crates/franken-node/src/schema_versions.rs"
test = false
doctest = false

[[test]]
name = "dependency_admission"
path = "harness.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("engine"))'] }

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11.0"
hex = "0.4.3"
rustix = { version = "1.1", features = ["fs"] }
url = "2.5"
tree-sitter = "0.26.8"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
tempfile = "3.19"
