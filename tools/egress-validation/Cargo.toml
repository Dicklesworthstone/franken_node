[package]
name = "franken-node-egress-validation"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "frankenengine_node"
path = "harness.rs"
test = false
doctest = false

[features]
default = ["engine"]
engine = []
http-client = ["dep:url"]
profiling = []

[dependencies]
frankenengine-extension-host = { path = "../../../franken_engine/crates/franken-extension-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.40", features = ["serde", "clock"] }
sha2 = "0.11.0"
hmac = "0.13.0"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
subtle = "2.6.1"
hex = "0.4.3"
tracing = "0.1"
thiserror = "2"
url = { version = "2.5", optional = true }

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"

[dev-dependencies]
tempfile = "3.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[[test]]
name = "ssrf_gated_host_io_egress"
path = "../../crates/franken-node/tests/ssrf_gated_host_io_egress.rs"
