[package]
name = "franken-migration-suite"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
publish = false
autobins = false

# Build the native migration operator independently of the optional engine
# library graph. The selected franken-node binary is a real child process.
[workspace]

[[bin]]
name = "franken-migration-suite"
path = "main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
