[package]
name = "franken-migration-suite"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
publish = false
autobins = false
default-run = "franken-migration-suite"

# Build the native migration operator independently of the optional engine
# library graph. The selected franken-node binary is a real child process.
[workspace]

[[bin]]
name = "franken-migration-suite"
path = "main.rs"

[[bin]]
name = "franken-migration-attest"
path = "attest.rs"

[[bin]]
name = "franken-rollout-verify"
path = "rollout_verify.rs"

[[bin]]
name = "franken-migration-apply"
path = "apply.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
zeroize = "1.8.2"
rand = "0.8.5"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
tree-sitter = "0.26.8"
tree-sitter-javascript = "0.25.0"
