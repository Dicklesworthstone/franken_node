[package]
name = "franken-captured-engine-bridge-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"
doctest = false

[features]
default = ["engine"]
engine = []

[dependencies]
franken-module-graph = { path = ".." }
frankenengine-engine = { path = "../../../../franken_engine/crates/franken-engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tree-sitter = "0.26.8"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "=0.23.2"
tempfile = "3"
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }