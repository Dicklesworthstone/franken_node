name: Native rewrite transactions

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-node/src/migration/rewrite_transaction.rs'
      - 'crates/franken-node/src/migration/rewrite_rollback.rs'
      - 'crates/franken-node/src/migration/mod.rs'
      - 'crates/franken-node/tests/native_rewrite_transactions.rs'
      - 'crates/franken-node/tests/native_project_suite_cli.rs'
      - '.github/workflows/native-rewrite-transaction.yml'
  pull_request:
    paths:
      - 'crates/franken-node/src/migration/rewrite_transaction.rs'
      - 'crates/franken-node/src/migration/rewrite_rollback.rs'
      - 'crates/franken-node/src/migration/mod.rs'
      - 'crates/franken-node/tests/native_rewrite_transactions.rs'
      - 'crates/franken-node/tests/native_project_suite_cli.rs'
      - '.github/workflows/native-rewrite-transaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply the reviewed restoration registration when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/rollback-registration.patch <<'PATCH'
          diff --git a/crates/franken-node/src/migration/rewrite_transaction.rs b/crates/franken-node/src/migration/rewrite_transaction.rs
          --- a/crates/franken-node/src/migration/rewrite_transaction.rs
          +++ b/crates/franken-node/src/migration/rewrite_transaction.rs
          @@ -26,6 +26,9 @@
           use std::sync::atomic::{AtomicU64, Ordering};
           use std::time::{SystemTime, UNIX_EPOCH};
           
          +#[path = "rewrite_rollback.rs"]
          +pub mod rollback;
          +
           pub const MAX_EDITS: usize = 1_000;
           pub const MAX_PLAN_BYTES: usize = 256 * 1024 * 1024;
           const MAX_FILE_BYTES: usize = 10 * 1024 * 1024;
          @@ -42,7 +45,7 @@
               pub after: &'a [u8],
           }
           
          -#[derive(Debug, Serialize, Deserialize)]
          +#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
           #[serde(deny_unknown_fields)]
           struct Record {
               path: String,
          @@ -54,7 +57,7 @@
               mode: u32,
           }
           
          -#[derive(Debug, Serialize, Deserialize)]
          +#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
           #[serde(deny_unknown_fields)]
           struct Journal {
               schema_version: String,
          @@ -75,6 +78,16 @@
               _lock: File,
           }
           
          +impl Drop for RewriteTransaction {
          +    fn drop(&mut self) {
          +        // flock belongs to the open file description, not this descriptor.
          +        // A concurrently spawned child can transiently inherit a duplicate
          +        // before CLOEXEC closes it. Release when the owner ends, rather than
          +        // leaving the next operation locked out until that duplicate closes.
          +        let _ = flock(&self._lock, FlockOperation::Unlock);
          +    }
          +}
          +
           fn unique_name(prefix: &str) -> String {
               static SEQUENCE: AtomicU64 = AtomicU64::new(0);
               let clock = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default().as_nanos();
          @@ -367,6 +380,22 @@
               use std::fs;
               use std::os::unix::fs::symlink;
           
          +    #[test]
          +    fn owner_drop_releases_lock_even_when_a_duplicate_descriptor_remains() {
          +        let root = tempfile::tempdir().unwrap();
          +        let transaction = RewriteTransaction::open(root.path()).unwrap();
          +        // A real dup shares the same kernel lock description as a forked child.
          +        let inherited = transaction._lock.try_clone().unwrap();
          +        assert!(RewriteTransaction::open(root.path()).is_err());
          +        drop(transaction);
          +        let next = RewriteTransaction::open(root.path()).unwrap();
          +        drop(inherited);
          +        assert!(RewriteTransaction::open(root.path()).is_err());
          +        drop(next);
          +        drop(RewriteTransaction::open(root.path()).unwrap());
          +    }
          +
               fn project() -> tempfile::TempDir {
                   let root = tempfile::tempdir().unwrap();
                   fs::write(root.path().join("a.js"), b"before-a").unwrap();
          diff --git a/crates/franken-node/src/migration/mod.rs b/crates/franken-node/src/migration/mod.rs
          --- a/crates/franken-node/src/migration/mod.rs
          +++ b/crates/franken-node/src/migration/mod.rs
          @@ -35,6 +35,9 @@
           #[cfg(target_os = "linux")]
           mod rewrite_transaction;
           
          +#[cfg(target_os = "linux")]
          +pub use rewrite_transaction::rollback;
          +
           #[cfg(target_os = "linux")]
           pub mod verified_rewrite;
           
          PATCH
          if git apply --recount --reverse --check evidence/rollback-registration.patch 2>/dev/null; then
            echo 'Restoration registration already present'
          else
            git apply --recount --check evidence/rollback-registration.patch
            git apply --recount evidence/rollback-registration.patch
          fi
          git diff --check
      - name: Compile and test the production transaction module in both layouts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          harness="$RUNNER_TEMP/rewrite-transaction-check"
          mkdir -p evidence "$harness"
          git rev-parse HEAD > evidence/revision.txt
          for file in rewrite_transaction.rs rewrite_rollback.rs mod.rs; do
            printf '%s ' "$file" >> evidence/compiled-source-blobs.txt
            git hash-object "crates/franken-node/src/migration/$file" >> evidence/compiled-source-blobs.txt
          done
          rustc +stable --version > evidence/rust-version.txt
          cat > "$harness/Cargo.toml" <<EOF
          [package]
          name = "franken-rewrite-transaction-check"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          path = "$GITHUB_WORKSPACE/crates/franken-node/src/migration/rewrite_transaction.rs"
          [[test]]
          name = "nested_transaction"
          path = "nested.rs"
          [dependencies]
          anyhow = "1.0"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          sha2 = "0.11"
          hex = "0.4"
          rustix = { version = "1.1", features = ["fs"] }
          [dev-dependencies]
          tempfile = "3"
          EOF
          cat > "$harness/nested.rs" <<EOF
          #![forbid(unsafe_code)]
          pub mod migration {
              #[path = "$GITHUB_WORKSPACE/crates/franken-node/src/migration/rewrite_transaction.rs"]
              pub mod rewrite_transaction;
          }
          EOF
          rustfmt +stable --edition 2024 --emit stdout crates/franken-node/src/migration/rewrite_transaction.rs > evidence/rewrite_transaction.formatted.rs
          cargo +stable test --manifest-path "$harness/Cargo.toml" -- --nocapture 2>&1 | tee evidence/transaction-tests.log
          cargo +stable clippy --manifest-path "$harness/Cargo.toml" --all-targets -- -D warnings 2>&1 | tee evidence/transaction-clippy.log
          cp "$harness/Cargo.lock" evidence/Cargo.lock
      - name: Commit only tested registrations directly to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- crates/franken-node/src/migration/rewrite_transaction.rs crates/franken-node/src/migration/mod.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- crates/franken-node/src/migration/rewrite_transaction.rs crates/franken-node/src/migration/mod.rs
            git commit -m 'feat(migration): expose transaction rollback with owner-bound lock release'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          git rev-parse HEAD > evidence/published-revision.txt
      - name: Preserve actual execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rewrite-transaction-evidence
          path: |
            evidence/
            crates/franken-node/src/migration/rewrite_transaction.rs
            crates/franken-node/src/migration/rewrite_rollback.rs
            crates/franken-node/src/migration/mod.rs
          retention-days: 7
          if-no-files-found: error

  primary-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the full primary module and run public rewrite API regressions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          harness="$RUNNER_TEMP/primary-rewrite-check"
          source_root="$GITHUB_WORKSPACE/crates/franken-node/src"
          mkdir -p "$harness" evidence
          cat > "$harness/Cargo.toml" <<EOF
          [package]
          name = "primary-rewrite-check"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          name = "frankenengine_node"
          path = "lib.rs"
          test = false
          doctest = false
          [[test]]
          name = "rewrite_transactions"
          path = "$GITHUB_WORKSPACE/crates/franken-node/tests/native_rewrite_transactions.rs"
          [features]
          admin-tools = []
          [dependencies]
          anyhow = "1.0"
          thiserror = "2.0"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          sha2 = "0.11"
          hex = "0.4"
          chrono = "0.4"
          tempfile = "3"
          tree-sitter = "0.26.8"
          tree-sitter-javascript = "0.25.0"
          rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
          EOF
          cat > "$harness/lib.rs" <<EOF
          #![forbid(unsafe_code)]
          extern crate self as frankenengine_node;
          #[path = "$source_root/config/timeouts.rs"]
          pub mod production_timeouts;
          pub mod config { pub use crate::production_timeouts as timeouts; }
          #[path = "$source_root/migration/mod.rs"]
          pub mod migration;
          EOF
          git rev-parse HEAD > evidence/revision.txt
          git ls-tree HEAD crates/franken-node/src/migration/mod.rs crates/franken-node/src/migration/rewrite_transaction.rs crates/franken-node/tests/native_rewrite_transactions.rs crates/franken-node/tests/native_project_suite_cli.rs > evidence/source-blobs.txt
          rustc +stable --version > evidence/rust-version.txt
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout "$source_root/migration/mod.rs" > /dev/null
          rustfmt +stable --edition 2024 --emit stdout crates/franken-node/tests/native_project_suite_cli.rs > evidence/registered-tests.formatted.rs
          cargo +stable test --manifest-path "$harness/Cargo.toml" --test rewrite_transactions -- --nocapture 2>&1 | tee evidence/primary-rewrite-tests.log
          cargo +stable clippy --manifest-path "$harness/Cargo.toml" --lib -- -D warnings 2>&1 | tee evidence/primary-rewrite-clippy.log
          cp "$harness/Cargo.lock" evidence/primary-Cargo.lock
      - name: Preserve compiled integration and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-rewrite-transaction-evidence
          path: |
            evidence/
            crates/franken-node/src/migration/mod.rs
            crates/franken-node/src/migration/rewrite_transaction.rs
            crates/franken-node/tests/native_rewrite_transactions.rs
            crates/franken-node/tests/native_project_suite_cli.rs
          retention-days: 7
          if-no-files-found: error
