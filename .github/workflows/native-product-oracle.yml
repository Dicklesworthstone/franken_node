name: Native product oracle

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-node/src/migration/**'
      - 'tools/migration-validator/**'
      - '.github/workflows/native-product-oracle.yml'
  pull_request:
    paths:
      - 'crates/franken-node/src/migration/**'
      - 'tools/migration-validator/**'
      - '.github/workflows/native-product-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-references:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repeated reduction fingerprints large real runtime binaries. Optimize
      # hashing while retaining debug assertions, all tests and strict deadlines.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Compile and exercise complete production operator and reduction regressions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy
          rustc +stable --version
          node --version
          bun --version
          git rev-parse HEAD
          manifest=tools/migration-validator/Cargo.toml
          cargo +stable test --manifest-path "$manifest" -- --nocapture --test-threads=2
          cargo +stable build --manifest-path "$manifest"
      - name: Real Node and Bun comparison capture replay reduction and reference drift through the CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          binary = Path('tools/migration-validator/target/debug/franken-migration-suite').resolve()
          bun = shutil.which('bun')
          node = shutil.which('node')
          assert bun and node, 'Both actual reference runtimes are mandatory'
          # /bin/false is a deliberately failing native leg, NEVER a stand-in
          # claiming to implement native Franken semantics. These cases prove
          # the real reference integration and fail-closed operator behavior.
          with tempfile.TemporaryDirectory(prefix='product-oracle-', dir=os.environ['RUNNER_TEMP']) as directory:
              root = Path(directory)
              original, candidate = root / 'original', root / 'candidate'
              source = "// removable setup\nconsole.log(42);require('fs').writeFileSync('artifact','same');\n"
              for project in (original, candidate):
                  (project / 'scripts').mkdir(parents=True)
                  (project / '.franken-node').mkdir()
                  (project / 'scripts/check.js').write_text(source)
                  (project / 'fixture.test.js').write_text("throw new Error('not an entrypoint');\n")
                  (project / '.franken-node/migration-tests.json').write_text(json.dumps({
                      'schema_version': 'franken-node/migration-tests/v1', 'tests': ['scripts/check.js']}))
              (candidate / 'candidate-only.txt').write_text('different captured inputs')
              base = [str(binary), str(original), '--migrated-project', str(candidate),
                      '--native-bin', '/bin/false', '--compare-filesystem', '--execute']

              def run(arguments, expected_exit):
                  result = subprocess.run(arguments, capture_output=True, text=True, timeout=340)
                  assert result.returncode == expected_exit, (result.returncode, result.stdout, result.stderr)
                  return json.loads(result.stdout)

              destination = root / 'measured.json'
              capsule = root / 'captured.json'
              report = run(base + ['--bun-bin', bun, '--capture-capsule', str(capsule), '--out', str(destination)], 1)
              assert report['schema_version'] == 'franken-node/product-validation-suite/v1'
              assert report['verdict'] == 'FAIL' and report['native_divergences'] == 1
              assert report['reference_failures'] == report['reference_divergences'] == 0
              assert report['total_tests'] == 1 and report['skipped'] == report['errored'] == 0
              assert report['input_sha256'] != report['candidate_input_sha256']
              assert report['distinct_reference_binaries'] is True
              assert report['node_runtime']['sha256'] != report['bun_runtime']['sha256']
              row = report['cases'][0]
              assert row['node'] == row['bun'] and row['node']['exit_code'] == 0
              assert row['node']['workspace_delta']['changed_paths'] == 1
              assert row['native']['exit_code'] == 1 and row['outcome'] == 'NATIVE_DIVERGENCE'
              assert report['release_certification'] is False
              assert json.loads(destination.read_text())['cases'] == report['cases']
              assert destination.stat().st_mode & 0o777 == 0o600
              assert capsule.stat().st_mode & 0o777 == 0o600
              assert not (original / 'artifact').exists() and not (candidate / 'artifact').exists()
              assert (original / 'scripts/check.js').read_text() == source
              pin = report['capsule']['content_sha256']
              assert report['capsule']['schema_version'] == 'franken-node/product-migration-capsule/v1'
              archive_bytes = capsule.read_bytes()

              # Neither later tree may replace the frozen original/candidate.
              (original / 'scripts/check.js').write_text('process.exit(99);')
              (candidate / 'scripts/check.js').write_text('throw new Error("not captured");')
              replay_args = [str(binary), str(capsule), '--replay', '--execute', '--expected-sha256', pin,
                             '--native-bin', '/bin/false', '--bun-bin', bun]
              replayed = run(replay_args, 0)
              assert replayed['verdict'] == 'REPRODUCED'
              assert replayed['validation']['verdict'] == 'FAIL'
              assert replayed['validation']['cases'] == report['cases']
              assert run(replay_args + ['--verify-fix'], 1)['verdict'] == 'FIX_NOT_VERIFIED'
              downgraded = run(replay_args[:-2], 2)
              assert downgraded['verdict'] == 'ERROR'
              inspected = run([str(binary), str(capsule), '--inspect-capsule'], 0)
              assert inspected['content_sha256'] == pin and inspected['execution_performed'] is False
              exported_dir = root / 'exported'
              exported = run([str(binary), str(capsule), '--export-inputs', str(exported_dir),
                              '--expected-sha256', pin], 0)
              assert exported['execution_performed'] is False
              assert exported_dir.stat().st_mode & 0o777 == 0o700
              assert (exported_dir / 'original/scripts/check.js').read_text() == source
              assert (exported_dir / 'candidate/scripts/check.js').read_text() == source
              assert json.loads((exported_dir / 'reproducer.json').read_text())['expected']['cases'] == report['cases']
              assert not (exported_dir / 'original/artifact').exists()
              assert capsule.read_bytes() == archive_bytes

              def reduce(args, before, name):
                  path = root / (name + '.json')
                  report_path = root / (name + '-report.json')
                  result = run(args + ['--minimize-capsule', str(path), '--out', str(report_path),
                                       '--max-executions', '48', '--minimize-seconds', '300'], 0)
                  assert result['schema_version'] == 'franken-node/product-minimization/v1'
                  assert result['verdict'] == 'REDUCED'
                  assert result['validation']['verdict'] == before['verdict']
                  assert result['validation']['cases'] == before['cases']
                  assert result['reduced_source_bytes'] < result['original_source_bytes']
                  assert result['statistics']['executions'] <= 48 and result['confirmations'] == 2
                  assert result['release_certification'] is False and result['environment_reproduced'] is False
                  assert path.stat().st_mode & 0o777 == 0o600
                  assert report_path.stat().st_mode & 0o777 == 0o600
                  assert json.loads(report_path.read_text())['validation'] == result['validation']
                  replay = run([str(binary), str(path), '--replay', '--execute', '--expected-sha256', result['content_sha256'],
                                '--native-bin', '/bin/false', '--bun-bin', bun], 0)
                  assert replay['verdict'] == 'REPRODUCED' and replay['validation']['cases'] == before['cases']
                  return result

              reduced_failure = reduce(replay_args, report, 'reduced-failure')
              assert reduced_failure['captured_verdict'] == 'FAIL'
              assert capsule.read_bytes() == archive_bytes
              assert (original / 'scripts/check.js').read_text() == 'process.exit(99);'

              # These seeds have exactly one line. Whole-line removal loses
              # measured output/effects; the original leg must shrink through
              # structural edits, not just comments or a discarded native leg.
              minified = "function unused(){return 12345;}(()=>{const dead=456;console.log(42);require('fs').writeFileSync('artifact','same');})();"
              for label, flags in [('pair', []), ('product', ['--bun-bin', bun])]:
                  for project in (original, candidate):
                      (project / 'scripts/check.js').write_text(minified)
                  seed_path = root / (label + '-minified-seed.json')
                  measured = run(base + flags + ['--capture-capsule', str(seed_path)], 1)
                  old_bytes = seed_path.read_bytes()
                  small_path = root / (label + '-minified-small.json')
                  minimized = run([str(binary), str(seed_path), '--replay', '--execute',
                      '--expected-sha256', measured['capsule']['content_sha256'], '--native-bin', '/bin/false']
                      + flags + ['--minimize-capsule', str(small_path), '--max-executions', '48', '--minimize-seconds', '300'], 0)
                  assert minimized['validation']['cases'] == measured['cases']
                  assert minimized['statistics']['syntax']['accepted'] >= 2
                  assert minimized['statistics']['executions'] <= 48
                  assert minimized['reduced_source_bytes'] < minimized['original_source_bytes']
                  small_pin = minimized['content_sha256']
                  replayed = run([str(binary), str(small_path), '--replay', '--execute',
                      '--expected-sha256', small_pin, '--native-bin', '/bin/false'] + flags, 0)
                  assert replayed['verdict'] == 'REPRODUCED'
                  assert replayed['validation']['cases'] == measured['cases']
                  export_dir = root / (label + '-minified-export')
                  run([str(binary), str(small_path), '--export-inputs', str(export_dir), '--expected-sha256', small_pin], 0)
                  extracted = (export_dir / 'original/scripts/check.js').read_text()
                  assert len(extracted) < len(minified) and 'unused' not in extracted and 'dead' not in extracted
                  assert not (export_dir / 'original/artifact').exists()
                  assert seed_path.read_bytes() == old_bytes
                  assert (original / 'scripts/check.js').read_text() == minified
                  assert (candidate / 'scripts/check.js').read_text() == minified

              # Reference disagreement is preserved, never converted to a pair
              # PASS or accepted as a baseline for verifying a native fix.
              disagreement_source = "function unused(){return 123;}console.log(process.versions.bun ? 'bun' : 'node');"
              (original / 'scripts/check.js').write_text(disagreement_source)
              disagreement_capsule = root / 'disagreement.json'
              disagreement = run(base + ['--bun-bin', bun, '--capture-capsule', str(disagreement_capsule)], 2)
              assert disagreement['verdict'] == 'INCONCLUSIVE'
              assert disagreement['reference_divergences'] == 1
              assert disagreement['cases'][0]['outcome'] == 'REFERENCE_DIVERGENCE'
              assert disagreement['cases'][0]['native']['exit_code'] == 1
              args = [str(binary), str(disagreement_capsule), '--replay', '--execute',
                      '--expected-sha256', disagreement['capsule']['content_sha256'],
                      '--native-bin', '/bin/false', '--bun-bin', bun]
              repeated = run(args, 0)
              assert repeated['verdict'] == 'REPRODUCED'
              assert repeated['validation']['cases'] == disagreement['cases']
              assert run(args + ['--verify-fix'], 2)['verdict'] == 'ERROR'
              disagreement_reduced = reduce(args, disagreement, 'reduced-disagreement')
              assert disagreement_reduced['captured_verdict'] == 'INCONCLUSIVE'
              assert disagreement_reduced['statistics']['syntax']['accepted'] > 0
              assert (original / 'scripts/check.js').read_text() == disagreement_source

              # Only Bun changes its observation when external state changes.
              # Stable Node evidence is not sufficient to verify a fix.
              marker = root / 'ambient-state'
              (original / 'scripts/check.js').write_text(
                  "console.log(process.versions.bun && require('fs').existsSync("
                  + json.dumps(str(marker)) + ") ? 'drift' : 'same');")
              drift_capsule = root / 'drift.json'
              drift_seed = run(base + ['--bun-bin', bun, '--capture-capsule', str(drift_capsule)], 1)
              marker.write_text('changed external state')
              drift = run([str(binary), str(drift_capsule), '--replay', '--verify-fix', '--execute',
                           '--expected-sha256', drift_seed['capsule']['content_sha256'],
                           '--native-bin', '/bin/false', '--bun-bin', bun], 2)
              assert drift['verdict'] == 'REFERENCE_DRIFT'
              assert drift['validation']['cases'][0]['node'] == drift_seed['cases'][0]['node']
              assert drift['validation']['cases'][0]['bun'] != drift_seed['cases'][0]['bun']

              # Capture and two seed confirmations agree. Search has no slots;
              # only the mandatory fresh final Bun leg sees drift. No reduced
              # capsule may be published even though Node is still unchanged.
              counter = root / 'bun-counter'
              counter.write_text('0')
              (original / 'scripts/check.js').write_text(
                  "if(process.versions.bun){const fs=require('fs');const p=" + json.dumps(str(counter))
                  + ";const n=Number(fs.readFileSync(p,'utf8'));fs.writeFileSync(p,String(n+1));"
                  + "console.log(n<3?'same':'drift');}else console.log('same');\n")
              final_seed_path = root / 'final-drift-seed.json'
              final_seed = run(base + ['--bun-bin', bun, '--capture-capsule', str(final_seed_path)], 1)
              refused_path = root / 'must-not-publish.json'
              refused = run([str(binary), str(final_seed_path), '--replay', '--execute',
                             '--expected-sha256', final_seed['capsule']['content_sha256'],
                             '--native-bin', '/bin/false', '--bun-bin', bun,
                             '--minimize-capsule', str(refused_path), '--max-executions', '4',
                             '--minimize-seconds', '300'], 2)
              assert refused['verdict'] == 'ERROR' and 'final confirmation' in refused['error']
              assert counter.read_text() == '4' and not refused_path.exists()

              missing = run(base + ['--bun-bin', str(root / 'missing-bun')], 2)
              assert missing['verdict'] == 'ERROR' and 'resolve Bun' in missing['error']
              alias = run(base + ['--bun-bin', node], 2)
              assert alias['verdict'] == 'ERROR' and 'distinct executable hashes' in alias['error']
              denied = subprocess.run([str(binary), str(original), '--bun-bin', bun,
                  '--native-bin', '/bin/false'], capture_output=True, text=True, timeout=10)
              assert denied.returncode == 2 and '--execute' in denied.stderr
              print('Real Node/Bun: minified pair/product reduction, native failure and reference disagreement, all-role replay, Bun-only final drift refusal, archive privacy and execution consent verified.')
          PY
      - name: Captured package-local settings and binary stdin on real Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          binary = Path('tools/migration-validator/target/debug/franken-migration-suite').resolve()
          bun = shutil.which('bun')
          assert bun, 'actual Bun is required'
          environment = dict(os.environ, APP_MODE='ambient', DROP_ME='ambient')

          def run(args, expected):
              result = subprocess.run([str(binary)] + args, capture_output=True, text=True,
                                      env=environment, timeout=340)
              assert result.returncode == expected, (result.returncode, result.stdout, result.stderr)
              return json.loads(result.stdout)

          with tempfile.TemporaryDirectory(prefix='execution-settings-', dir=os.environ['RUNNER_TEMP']) as directory:
              root = Path(directory)
              test = 'packages/api/check.cjs'
              request = bytes([0, 255, 120, 10, 10])
              source = "// removable\nconst fs=require('node:fs');if(process.env.APP_MODE!=='fixture'||process.env.DROP_ME!==undefined)process.exit(90);const input=fs.readFileSync(0);process.stdout.write(input);console.log(fs.readFileSync('local.txt','utf8'));fs.writeFileSync('artifact',input);\n// tail\n"
              config = {'schema_version':'franken-node/migration-tests/v1',
                        'tests':[test, 'check-default.cjs'],
                        'execution':{test:{'cwd':'packages/api','stdin':'fixtures/request.bin',
                                           'environment':{'APP_MODE':'fixture','DROP_ME':None}}}}
              for label, runtime_flags in [('pair', []), ('product', ['--bun-bin', bun])]:
                  original, candidate = root / (label+'-original'), root / (label+'-candidate')
                  for project in (original, candidate):
                      (project / 'packages/api').mkdir(parents=True)
                      (project / '.franken-node').mkdir()
                      (project / 'fixtures').mkdir()
                      (project / test).write_text(source)
                      (project / 'packages/api/local.txt').write_text('package-local')
                      (project / 'fixtures/request.bin').write_bytes(request)
                      (project / '.franken-node/migration-tests.json').write_text(json.dumps(config))
                      (project / 'check-default.cjs').write_text("if(process.env.APP_MODE!=='ambient'||process.env.DROP_ME!=='ambient'||require('node:fs').readFileSync(0).length!==0)process.exit(91);console.log('default');")
                  (candidate / 'candidate-only.txt').write_text('distinct inputs')
                  capsule = root / (label+'-capsule.json')
                  base = [str(original), '--migrated-project', str(candidate), '--native-bin', '/bin/false',
                          '--execute', '--compare-filesystem'] + runtime_flags
                  # /bin/false is intentionally a failing native leg, not a
                  # Franken implementation or a successful compatibility claim.
                  captured = run(base + ['--capture-capsule', str(capsule)], 1)
                  assert captured['total_tests'] == 2 and captured['verdict'] == 'FAIL'
                  row = next(row for row in captured['cases'] if row['test'] == test)
                  reference = row['node'] if label == 'product' else row['reference']
                  assert reference['exit_code'] == 0
                  assert reference['stdout']['sha256'] == hashlib.sha256(request+b'package-local\n').hexdigest()
                  assert reference['workspace_delta']['changed_paths'] == 1
                  assert 'packages/api/artifact' in json.dumps(reference['workspace_delta'])
                  if label == 'product':
                      assert row['node'] == row['bun'] and captured['reference_divergences'] == 0
                  pin = captured['capsule']['content_sha256']
                  seed_bytes = capsule.read_bytes()
                  for project in (original, candidate):
                      (project / 'fixtures/request.bin').write_bytes(b'later input')
                      (project / '.franken-node/migration-tests.json').write_text('{}')
                  replay_args = [str(capsule), '--replay', '--execute', '--expected-sha256', pin,
                                 '--native-bin', '/bin/false'] + runtime_flags
                  replayed = run(replay_args, 0)
                  assert replayed['verdict'] == 'REPRODUCED' and replayed['validation']['cases'] == captured['cases']
                  reduced_path = root / (label+'-reduced.json')
                  reduced = run(replay_args + ['--minimize-capsule', str(reduced_path), '--source-file', test,
                                               '--max-executions', '16', '--minimize-seconds', '300'], 0)
                  assert reduced['validation']['cases'] == captured['cases']
                  exported = root / (label+'-fixture')
                  run([str(reduced_path), '--export-inputs', str(exported),
                       '--expected-sha256', reduced['content_sha256']], 0)
                  for tree in ('original','candidate'):
                      assert (exported / tree / 'fixtures/request.bin').read_bytes() == request
                      assert json.loads((exported / tree / '.franken-node/migration-tests.json').read_text()) == config
                      assert not (exported / tree / 'packages/api/artifact').exists()
                  assert capsule.read_bytes() == seed_bytes
                  assert not (original / 'packages/api/artifact').exists()
                  assert (original / 'fixtures/request.bin').read_bytes() == b'later input'
                  # All preflight checks occur before missing runtime resolution.
                  for project in (original, candidate):
                      (project / '.franken-node/migration-tests.json').write_text(json.dumps(config))
                  (candidate / 'fixtures/request.bin').write_bytes(b'different candidate request')
                  refused = run([str(original),'--migrated-project',str(candidate),'--native-bin','/absent/native','--execute'] + runtime_flags, 2)
                  assert 'stdin bytes differ' in refused['error']
              print('Configured Node/Bun: exact binary stdin, package-local paths, isolated environment overrides, all-case replay/reduction/export and input-substitution refusal verified.')
          PY
      - name: Strict production and test lint
        run: cargo +stable clippy --manifest-path tools/migration-validator/Cargo.toml --all-targets -- -D warnings
