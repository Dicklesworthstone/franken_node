name: Native egress

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-node/src/security/ssrf_policy*'
      - 'crates/franken-node/src/security/ssrf_policy/**'
      - 'crates/franken-node/src/ops/*host_io.rs'
      - 'crates/franken-node/tests/ssrf*'
      - '.github/workflows/native-egress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute production IPv6 classifier and allocation boundary tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustc +stable --version
          git rev-parse HEAD
          source=crates/franken-node/src/security/ssrf_policy/ipv6.rs
          rustc +stable --edition 2024 --test "$source" -D warnings -o "$RUNNER_TEMP/ipv6-policy-tests"
          "$RUNNER_TEMP/ipv6-policy-tests" --nocapture | tee ipv6-policy-tests.log
      - name: Retain exact policy and transport sources for cross-layer regression diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-egress-validation
          retention-days: 7
          path: |
            ipv6-policy-tests.log
            crates/franken-node/src/security/ssrf_policy.rs
            crates/franken-node/src/security/ssrf_policy/
            crates/franken-node/src/security/network_guard.rs
            crates/franken-node/src/security/remote_cap.rs
            crates/franken-node/src/ops/ssrf_gated_host_io.rs
            crates/franken-node/src/ops/flow_gated_host_io.rs
            crates/franken-node/tests/ssrf*.rs
            crates/franken-node/src/config.rs
            crates/franken-node/src/config/timeouts.rs
            crates/franken-node/src/capacity_defaults.rs
            crates/franken-node/src/lock_utils.rs
            docs/plans/PLAN_TO_CREATE_FRANKEN_NODE.md
