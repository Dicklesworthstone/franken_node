name: dist

# Release pipeline for the `franken-node` binary.
#
# Produces the canonical fleet artifacts consumed by install.sh and by dsr:
#   franken-node-<target-triple>.tar.xz
#   franken-node-<target-triple>.tar.xz.sha256        (shasum -a 256 format)
#   franken-node-<target-triple>.tar.xz.sigstore.json (cosign, keyless)
#
# franken-node's default `engine` feature depends on franken_engine via a
# relative path (../../../franken_engine/crates/franken-engine), so the build
# checks out franken_engine as a sibling of franken_node. Linux ships gnu
# (the engine links C deps; musl static is intentionally avoided).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # bd-2djfa: release evidence and binaries are one immutable source pair.
  # Update this only with a fresh compatibility + close-condition campaign.
  FRANKEN_ENGINE_REVISION: 6d204d13c710cb6e8d279f93b629ba6588add106
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22.14.0
  RELEASE_EVIDENCE_MAX_AGE_HOURS: 6

jobs:
  release-certification:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout franken_node release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: franken_node
          fetch-depth: 0

      - name: Checkout pinned franken_engine release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Dicklesworthstone/franken_engine
          ref: ${{ env.FRANKEN_ENGINE_REVISION }}
          path: franken_engine

      - name: Prove exact release source pair
        working-directory: franken_node
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C ../franken_engine rev-parse HEAD)" = "${FRANKEN_ENGINE_REVISION}"
          if [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          fi

      - name: Install pinned Bun reference runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install pinned Node.js reference runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-15

      - name: Build release-certification binary
        working-directory: franken_node
        env:
          RCH_CARGO_WRAPPER_BYPASS: "1"
          FRANKEN_NODE_SOURCE_GIT_SHA: ${{ github.sha }}
          FRANKEN_ENGINE_SOURCE_GIT_SHA: ${{ env.FRANKEN_ENGINE_REVISION }}
        run: cargo build --release -p frankenengine-node --bin franken-node

      - name: Execute genuine compatibility corpus
        working-directory: franken_node
        env:
          FRANKEN_NODE_SOURCE_GIT_SHA: ${{ github.sha }}
          FRANKEN_ENGINE_SOURCE_GIT_SHA: ${{ env.FRANKEN_ENGINE_REVISION }}
        run: |
          set -euo pipefail
          ./target/release/franken-node ops compat-corpus-run \
            --corpus-root crates/franken-node/tests/fixtures/compat_corpus \
            --out artifacts/13/compatibility_corpus_results.json \
            --case-timeout-secs 10 \
            --require-node-reference \
            --json | tee /tmp/release_compatibility_corpus_run.json

      - name: Produce proof-carrying L1 evidence from the same binary
        working-directory: franken_node
        env:
          FRANKEN_NODE_SOURCE_GIT_SHA: ${{ github.sha }}
          FRANKEN_ENGINE_SOURCE_GIT_SHA: ${{ env.FRANKEN_ENGINE_REVISION }}
        run: |
          set -euo pipefail
          ./target/release/franken-node ops proof-carrying-evidence \
            --merge-corpus artifacts/13/compatibility_corpus_results.json \
            --merge-l1-verdict artifacts/oracle/l1_product_verdict.json \
            --json | tee /tmp/release_l1_evidence.json

      - name: Enforce compatibility thresholds before receipt generation
        working-directory: franken_node
        run: |
          set -euo pipefail
          python3 scripts/check_compatibility_corpus_pass_gate.py --json \
            | tee /tmp/release_compatibility_gate.json

      - name: Generate signed live composite close-condition receipt
        working-directory: franken_node
        env:
          FRANKEN_NODE_SOURCE_GIT_SHA: ${{ github.sha }}
          FRANKEN_ENGINE_SOURCE_GIT_SHA: ${{ env.FRANKEN_ENGINE_REVISION }}
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > /tmp/franken_node_release_receipt_signing.key
          ./target/release/franken-node doctor close-condition \
            --receipt-signing-key /tmp/franken_node_release_receipt_signing.key \
            --release-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --json | tee /tmp/release_close_condition.json

      - name: Bind release decision to fresh source-matched evidence
        working-directory: franken_node
        run: |
          set -euo pipefail
          python3 scripts/check_oracle_close_condition.py \
            --release-mode \
            --expected-franken-node-revision "${GITHUB_SHA}" \
            --expected-franken-engine-revision "${FRANKEN_ENGINE_REVISION}" \
            --expected-release-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --max-age-hours "${RELEASE_EVIDENCE_MAX_AGE_HOURS}" \
            --json | tee /tmp/release_oracle_gate.json

      - name: Package auditable release-certification evidence
        working-directory: franken_node
        run: |
          set -euo pipefail
          mkdir -p release-evidence/payload
          cp artifacts/13/compatibility_corpus_results.json release-evidence/payload/
          cp artifacts/oracle/l1_product_verdict.json release-evidence/payload/
          cp artifacts/oracle/close_condition_receipt.json release-evidence/payload/
          cp /tmp/release_compatibility_corpus_run.json release-evidence/payload/
          cp /tmp/release_l1_evidence.json release-evidence/payload/
          cp /tmp/release_compatibility_gate.json release-evidence/payload/
          cp /tmp/release_close_condition.json release-evidence/payload/
          cp /tmp/release_oracle_gate.json release-evidence/payload/
          jq -n \
            --arg franken_node_commit "${GITHUB_SHA}" \
            --arg franken_engine_commit "${FRANKEN_ENGINE_REVISION}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            '{schema_version:"franken-node/release-certification-bundle/v1",franken_node_commit:$franken_node_commit,franken_engine_commit:$franken_engine_commit,run_url:$run_url}' \
            > release-evidence/payload/source-pair.json
          bundle="franken-node-release-certification-${GITHUB_SHA}.tar.xz"
          tar -cJf "release-evidence/${bundle}" -C release-evidence/payload .
          (cd release-evidence && shasum -a 256 "${bundle}" > "${bundle}.sha256")

      - name: Upload release-certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-certification-evidence
          path: |
            /tmp/release_compatibility_corpus_run.json
            /tmp/release_l1_evidence.json
            /tmp/release_compatibility_gate.json
            /tmp/release_close_condition.json
            /tmp/release_oracle_gate.json
            franken_node/artifacts/13/compatibility_corpus_results.json
            franken_node/artifacts/oracle/l1_product_verdict.json
            franken_node/artifacts/oracle/close_condition_receipt.json

      - name: Upload releasable certification bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-certification-bundle
          path: franken_node/release-evidence/*

  build:
    needs: release-certification
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout franken_node
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: franken_node

      - name: Checkout franken_engine (sibling dependency)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Dicklesworthstone/franken_engine
          ref: ${{ env.FRANKEN_ENGINE_REVISION }}
          path: franken_engine

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-15
          targets: ${{ matrix.target }}

      - name: Build franken-node
        working-directory: franken_node
        env:
          RCH_CARGO_WRAPPER_BYPASS: "1"
          FRANKEN_NODE_SOURCE_GIT_SHA: ${{ github.sha }}
          FRANKEN_ENGINE_SOURCE_GIT_SHA: ${{ env.FRANKEN_ENGINE_REVISION }}
        run: cargo build --release -p frankenengine-node --bin franken-node --target ${{ matrix.target }}

      - name: Create tarball
        working-directory: franken_node
        run: |
          set -euo pipefail
          mkdir -p dist
          TARBALL="franken-node-${{ matrix.target }}.tar.xz"
          binary="target/${{ matrix.target }}/release/franken-node"
          [ -f "$binary" ] || { echo "::error::expected binary not found at $binary"; exit 1; }
          tar -cJf "dist/$TARBALL" -C "target/${{ matrix.target }}/release" franken-node
          (cd dist && shasum -a 256 "$TARBALL" > "$TARBALL.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: franken_node/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts (sigstore bundle)
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          for f in franken-node-*.tar.xz; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Copy + checksum install scripts
        run: |
          set -euo pipefail
          for script in install.sh install.ps1; do
            cp "$script" dist/ 2>/dev/null || echo "no $script"
            if [ -f "dist/$script" ]; then
              (cd dist && shasum -a 256 "$script" > "$script.sha256")
              cosign sign-blob --yes --bundle "dist/$script.sigstore.json" "dist/$script"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
