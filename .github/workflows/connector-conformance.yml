name: Connector Conformance Gate

on:
  pull_request:
    paths:
      - 'crates/franken-node/src/conformance/**'
      - 'crates/franken-node/src/connector/**'
  push:
    branches: [main]
    paths:
      - 'crates/franken-node/src/conformance/**'
      - 'crates/franken-node/src/connector/**'

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling repositories
        uses: ./.github/actions/franken-siblings

      # The conformance:: and connector:: unit tests are inline #[cfg(test)]
      # modules. A default `cargo test` compiles them OUT (lib.rs gate) and the
      # connector modules additionally need opt-in features, so the former
      # `cargo test -- conformance::` (which also never parsed: the trailing
      # colon broke the YAML) could only ever pass by running zero tests.
      # Run the dedicated inline lane and fail if a filter matches nothing.
      - name: Run conformance and connector inline tests
        run: |
          set -euo pipefail
          for filter in 'conformance::' 'connector::'; do
            RUSTFLAGS='--cfg franken_node_inline_tests' cargo test -p frankenengine-node \
              --features extended-surfaces,test-support --lib -- "$filter" 2>&1 | tee "/tmp/inline-${filter%::}.log"
            passed=$(sed -n 's/^test result: [a-z]*\. \([0-9]*\) passed.*/\1/p' "/tmp/inline-${filter%::}.log" | awk '{s+=$1} END {print s+0}')
            echo "filter=${filter} passed=${passed}"
            if [ "${passed}" -eq 0 ]; then
              echo "FAIL: filter ${filter} executed zero tests" >&2
              exit 1
            fi
          done

      - name: Run Python verification
        run: |
          python3 scripts/check_connector_lifecycle.py --json > /tmp/lifecycle.json
          python3 scripts/check_health_gate.py --json > /tmp/health_gate.json
          python3 scripts/check_method_validator.py --json > /tmp/method_validator.json
          python3 scripts/check_conformance_harness.py --json > /tmp/conformance_harness.json

      - name: Verify all gates pass
        run: |
          for f in /tmp/lifecycle.json /tmp/health_gate.json /tmp/method_validator.json /tmp/conformance_harness.json; do
            verdict=$(python3 -c "import json; print(json.load(open('$f'))['verdict'])")
            if [ "$verdict" != "PASS" ]; then
              echo "FAIL: $f"
              exit 1
            fi
          done
          echo "All conformance gates passed"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence
          path: |
            /tmp/*.json
            /tmp/inline-*.log
