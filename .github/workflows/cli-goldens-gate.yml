name: CLI Subcommand Goldens Gate

# bd-27gbr: the `cli_subcommand_goldens` [[test]] target requires the
# `test-support` feature, so no default `cargo test` lane ever ran it and its
# snapshots drifted silently RED for months. This gate runs the target
# explicitly whenever the CLI contract surface or its goldens change.

on:
  pull_request:
    paths:
      - "crates/franken-node/tests/cli_subcommand_goldens.rs"
      - "crates/franken-node/tests/cli_golden_helpers.rs"
      - "crates/franken-node/tests/goldens/**"
      - "crates/franken-node/src/cli.rs"
      - "crates/franken-node/src/main.rs"
      - ".github/workflows/cli-goldens-gate.yml"
  push:
    branches: [main]
    paths:
      - "crates/franken-node/tests/cli_subcommand_goldens.rs"
      - "crates/franken-node/tests/cli_golden_helpers.rs"
      - "crates/franken-node/tests/goldens/**"
      - "crates/franken-node/src/cli.rs"
      - "crates/franken-node/src/main.rs"
      - ".github/workflows/cli-goldens-gate.yml"
  workflow_dispatch: {}

# Pushes to main arrive every few minutes and the engine build takes hours;
# cancelling in-progress runs on main meant no run ever finished. Only PR runs
# cancel; on main the running job completes and only the newest push waits.
concurrency:
  group: cli-goldens-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-subcommand-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The workspace needs every path-dependency sibling (franken_engine,
      # frankentui, fastapi_rust, sqlmodel_rust, ...). Checking out only
      # franken_engine left `ftui` unresolvable, so this gate failed at
      # manifest load on every run and never compared a snapshot.
      - name: Checkout sibling repositories
        uses: ./.github/actions/franken-siblings

      - name: Cache cargo home and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-goldens
          key: ${{ hashFiles('Cargo.lock', 'crates/franken-node/Cargo.toml') }}
          cache-all-crates: "true"

      - name: Run CLI subcommand goldens (fail on snapshot drift)
        run: |
          set -euo pipefail
          # CI=true makes insta fail on mismatch instead of writing pending
          # snapshots; drift must be re-blessed deliberately via
          # `cargo insta review` after verifying the surface change intent.
          cargo test -p frankenengine-node --features test-support \
            --test cli_subcommand_goldens \
            --test cli_error_goldens
