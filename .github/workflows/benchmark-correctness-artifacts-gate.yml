name: Benchmark Correctness Artifacts Gate

on:
  pull_request:
    paths:
      - "crates/franken-node/src/**"
      - "crates/franken-engine/src/**"
      - "crates/asupersync/src/**"
      - "services/**"
      - "docs/change_summaries/**"
      - "docs/templates/change_summary_template.md"
      - "perf/budgets.toml"
      - "scripts/bench_runtime_vs_node.py"
      - "tests/test_bench_runtime_vs_node.py"
      - "artifacts/perf/runtime_vs_node.json"
      - "scripts/check_benchmark_correctness_artifacts.py"
      - "tests/test_check_benchmark_correctness_artifacts.py"
      - ".github/workflows/benchmark-correctness-artifacts-gate.yml"
  push:
    branches: [main]
    paths:
      - "crates/franken-node/src/**"
      - "crates/franken-engine/src/**"
      - "crates/asupersync/src/**"
      - "services/**"
      - "docs/change_summaries/**"
      - "docs/templates/change_summary_template.md"
      - "perf/budgets.toml"
      - "scripts/bench_runtime_vs_node.py"
      - "tests/test_bench_runtime_vs_node.py"
      - "artifacts/perf/runtime_vs_node.json"
      - "scripts/check_benchmark_correctness_artifacts.py"
      - "tests/test_check_benchmark_correctness_artifacts.py"
      - ".github/workflows/benchmark-correctness-artifacts-gate.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

jobs:
  benchmark-correctness-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install pytest cryptography

      - name: Run runtime-vs-node benchmark harness unit + e2e tests
        run: python3 -m pytest tests/test_bench_runtime_vs_node.py -v

      - name: Build changed-file list
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed_files.txt
          else
            git diff --name-only HEAD~1...HEAD > /tmp/changed_files.txt
          fi
          cat /tmp/changed_files.txt

      - name: Run benchmark/correctness artifacts gate
        run: |
          python3 scripts/check_benchmark_correctness_artifacts.py \
            --changed-files /tmp/changed_files.txt \
            --json > /tmp/benchmark_correctness_artifacts_gate.json

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-correctness-artifacts-gate
          path: /tmp/benchmark_correctness_artifacts_gate.json

  cold-start-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling repositories and pinned toolchain
        uses: ./.github/actions/franken-siblings

      - name: Build franken-node (release)
        run: cargo build --locked -p frankenengine-node --release --bin franken-node

      - name: Enforce perf/budgets.toml ci_dev cold-start budget vs live Node
        run: |
          python3 scripts/bench_runtime_vs_node.py \
            --bin target/release/franken-node \
            --enforce-cold-start-budget ci_dev \
            --json \
            --out /tmp/runtime_vs_node_canary.json

      - name: Upload cold-start canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-vs-node-cold-start-canary
          path: /tmp/runtime_vs_node_canary.json
