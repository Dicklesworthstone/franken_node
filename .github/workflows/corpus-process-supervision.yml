name: Corpus process supervision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corpus-process-supervision.yml'
      - 'crates/franken-node/src/ops/corpus_process.rs'
      - 'crates/franken-node/src/ops/compat_corpus_run.rs'
      - 'crates/franken-node/src/migration/smoke_supervisor.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-supervision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the actual process owner and corpus capture
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          source="$GITHUB_WORKSPACE/crates/franken-node/src"
          harness="$RUNNER_TEMP/corpus-process-check"
          mkdir -p "$harness" evidence
          cat > "$harness/Cargo.toml" <<'TOML'
          [package]
          name = "corpus-process-check"
          version = "0.0.0"
          edition = "2024"
          autotests = false
          [workspace]
          [[test]]
          name = "process_supervision"
          path = "tests.rs"
          [dependencies]
          anyhow = "1.0"
          sha2 = "0.11"
          hex = "0.4"
          tempfile = "3"
          rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
          TOML
          cat > "$harness/tests.rs" <<RUST
          #![forbid(unsafe_code)]
          mod migration {
              #[path = "$source/migration/smoke_supervisor.rs"]
              pub(crate) mod smoke_supervisor;
          }
          mod compat_corpus_run {
              #[path = "$source/ops/corpus_process.rs"]
              mod corpus_process;
          }
          RUST
          rustfmt +stable --edition 2024 --check "$source/migration/smoke_supervisor.rs" "$source/ops/corpus_process.rs"
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout "$source/ops/compat_corpus_run.rs" > /dev/null
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout "$source/migration/mod.rs" > /dev/null
          git rev-parse HEAD > evidence/revision.txt
          rustc +stable --version > evidence/rust-version.txt
          git ls-tree HEAD crates/franken-node/src/migration/smoke_supervisor.rs crates/franken-node/src/ops/corpus_process.rs crates/franken-node/src/ops/compat_corpus_run.rs crates/franken-node/src/migration/mod.rs > evidence/source-blobs.txt
          cargo +stable test --manifest-path "$harness/Cargo.toml" --test process_supervision -- --nocapture --test-threads=2 2>&1 | tee evidence/process-tests.log
          cargo +stable clippy --manifest-path "$harness/Cargo.toml" --test process_supervision -- -D warnings 2>&1 | tee evidence/process-clippy.log
          cp "$harness/Cargo.lock" evidence/process-Cargo.lock
      - name: Preserve exact source and executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-process-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/
            crates/franken-node/src/migration/mod.rs
            crates/franken-node/src/migration/smoke_supervisor.rs
            crates/franken-node/src/ops/compat_corpus_run.rs
            crates/franken-node/src/ops/corpus_process.rs

  migration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the shared owner's existing migration behavior
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          node --version > evidence/node-version.txt
          cargo +stable test --manifest-path tools/migration-validator/Cargo.toml -- --nocapture --test-threads=2 2>&1 | tee evidence/migration-regression-tests.log
          cargo +stable clippy --manifest-path tools/migration-validator/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/migration-clippy.log
      - name: Preserve migration regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-shared-owner-migration-evidence
          retention-days: 7
          if-no-files-found: error
          path: evidence/
