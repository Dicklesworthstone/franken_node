name: Security Domain Golden Artifacts & Fuzzing

on:
  pull_request:
    paths:
      - 'crates/franken-node/src/security/**'
      - 'crates/franken-node/tests/golden_artifacts_comprehensive.rs'
      - 'tests/golden/**'
      - 'fuzz/**'
      - '.github/workflows/security-golden-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'crates/franken-node/src/security/**'
      - 'crates/franken-node/tests/golden_artifacts_comprehensive.rs'
      - 'tests/golden/**'
      - 'fuzz/**'
      - '.github/workflows/security-golden-artifacts.yml'
  workflow_dispatch: {}

jobs:
  golden-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling repositories and pinned toolchain
        uses: ./.github/actions/franken-siblings

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run security golden artifacts tests (fail if mismatched)
        run: |
          set -euo pipefail
          cargo test --locked -p frankenengine-node --features extended-surfaces,test-support \
            --test golden_security_serialization \
            --test artifact_signing_golden_tests \
            --test decision_receipt_signed_golden_conformance \
            --test decision_receipt_golden_vectors_conformance

          if [ -n "$(git status --porcelain -- '*.golden' 'tests/golden/**' 'crates/franken-node/tests/golden/**')" ]; then
            echo "ERROR: Uncommitted or newly created .golden files detected during CI run"
            git status --short -- '*.golden' 'tests/golden/**' 'crates/franken-node/tests/golden/**'
            exit 1
          fi

      - name: Run promoted security fuzz regression suite
        run: |
          set -euo pipefail
          python3 tests/test_check_fuzz_regression_corpus.py
          python3 scripts/check_fuzz_regression_corpus.py --json > fuzz_corpus_gate.json
          cargo test --locked -p frankenengine-node --features extended-surfaces,test-support \
            --test remote_capability_gate_fuzz_regression

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-golden-test-evidence
          path: |
            fuzz_corpus_gate.json
            crates/franken-node/tests/golden/
          retention-days: 7

  security-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling repositories and pinned toolchain
        uses: ./.github/actions/franken-siblings

      - name: Cache cargo registry and fuzz target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Compile all 146 registered fuzz targets
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Run unmasked risk-weighted + rotating fuzz smoke subset with sha256 receipts
        run: |
          set -euo pipefail
          mkdir -p artifacts/verification
          python3 scripts/check_fuzz_regression_corpus.py \
            --run-smoke-subset 8 \
            --rotation-key "${GITHUB_SHA}" \
            --max-total-time 20 \
            --receipt-jsonl artifacts/verification/fuzz_smoke_receipts.jsonl

      - name: Upload fuzzing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-fuzzing-evidence
          path: |
            artifacts/verification/fuzz_smoke_receipts.jsonl
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 7

  security-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [golden-artifacts, security-fuzzing]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling repositories and pinned toolchain
        uses: ./.github/actions/franken-siblings

      - name: "Run inline security:: module unit tests"
        run: |
          set -euo pipefail
          env CARGO_INCREMENTAL=0 RUSTFLAGS="--cfg franken_node_inline_tests" cargo test \
            --locked \
            -p frankenengine-node \
            --lib \
            --features extended-surfaces,test-support \
            security::

      - name: Validate security hardening patterns
        run: |
          set -euo pipefail
          grep -rq "ct_eq\|ct_eq_bytes\|ConstantTimeEq" crates/franken-node/src/security/ --include="*.rs"
          grep -rq "saturating_" crates/franken-node/src/security/ --include="*.rs"

      - name: Security gate summary
        run: |
          echo "=== Security Domain CI Gate Summary ==="
          echo "Golden artifacts tests passed (no mismatches)"
          echo "All 146 fuzz targets compiled and risk-weighted subset smoked cleanly"
          echo "Promoted fuzz regressions and inline security:: unit tests passed"
