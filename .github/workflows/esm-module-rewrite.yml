          --- a/crates/franken-node/src/migration/module_specifiers.rs
          +++ b/crates/franken-node/src/migration/module_specifiers.rs
          @@ -143,3 +143,3 @@
          -fn text(source: &str, node: Node<'_>) -> &str {
