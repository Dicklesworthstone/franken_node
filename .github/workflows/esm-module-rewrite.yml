name: ESM module rewriting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/esm-module-rewrite.yml'
      - 'crates/franken-node/src/migration/module_specifiers.rs'
      - 'crates/franken-node/src/migration/mod.rs'
      - 'crates/franken-node/tests/native_rewrite_transactions.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  esm-rewrites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed primary integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/integration.patch <<'PATCH'
