name: ESM module rewriting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/esm-module-rewrite.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/native_rewrite_transactions.rs'
  pull_request:
    paths:
      - '.github/workflows/esm-module-rewrite.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/native_rewrite_transactions.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  esm-rewrites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage reviewed typed-source integration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # Immutable manually reviewed patch stored in this repository's Git
          # object database. No source synthesis, regex rewrite or dependency patch.
          gh api repos/Dicklesworthstone/franken_node/git/blobs/1c242ad18f59e2cd293dd006390296feb8c73692 --jq .content | base64 --decode > evidence/typescript.patch
          test "$(git hash-object evidence/typescript.patch)" = 1c242ad18f59e2cd293dd006390296feb8c73692
          if git apply --recount --reverse --check evidence/typescript.patch 2>/dev/null; then
            echo 'Typed integration already present'
          else
            git apply --recount --check evidence/typescript.patch
            git apply --recount evidence/typescript.patch
          fi
          test "$(git hash-object crates/franken-node/src/migration/module_specifiers.rs)" = fd466221ee8413fc7b30ac74621ab937fd9a5ec0
          test "$(git hash-object crates/franken-node/src/migration/mod.rs)" = 9f07fcddc811e9d3db436e92f92dfe5aed8acb43
          git diff --check
      - name: Compile the primary implementation and execute real rewrite tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          primary="$RUNNER_TEMP/esm-primary"
          tests="$RUNNER_TEMP/esm-tests"
          source="$GITHUB_WORKSPACE/crates/franken-node/src"
          mkdir -p "$primary" "$tests" evidence
          cat > "$primary/Cargo.toml" <<'TOML'
          [package]
          name = "esm-primary"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          name = "frankenengine_node"
          path = "lib.rs"
          test = false
          doctest = false
          [features]
          admin-tools = []
          [dependencies]
          anyhow = "1.0"
          thiserror = "2.0"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          sha2 = "0.11"
          hex = "0.4"
          chrono = "0.4"
          tempfile = "3"
          tree-sitter = "0.26.8"
          tree-sitter-javascript = "0.25.0"
          tree-sitter-typescript = "=0.23.2"
          rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
          TOML
          cat > "$primary/lib.rs" <<RUST
          #![forbid(unsafe_code)]
          extern crate self as frankenengine_node;
          #[path = "$source/config/timeouts.rs"]
          pub mod production_timeouts;
          pub mod config { pub use crate::production_timeouts as timeouts; }
          #[path = "$source/migration/mod.rs"]
          pub mod migration;
          RUST
          cat > "$tests/Cargo.toml" <<TOML
          [package]
          name = "esm-rewrite-tests"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          path = "lib.rs"
          [[test]]
          name = "primary_rewrites"
          path = "$GITHUB_WORKSPACE/crates/franken-node/tests/native_rewrite_transactions.rs"
          [dependencies]
          frankenengine_node = { package = "esm-primary", path = "$primary" }
          tempfile = "3"
          serde_json = "1.0"
          sha2 = "0.11"
          hex = "0.4"
          tree-sitter = "0.26.8"
          tree-sitter-javascript = "0.25.0"
          tree-sitter-typescript = "=0.23.2"
          TOML
          cat > "$tests/lib.rs" <<RUST
          #![forbid(unsafe_code)]
          #[cfg(test)]
          #[path = "$source/migration/module_specifiers.rs"]
          mod module_specifiers;
          RUST
          git rev-parse HEAD > evidence/revision.txt
          node --version > evidence/node-version.txt
          rustc +stable --version > evidence/rust-version.txt
          for file in mod.rs module_specifiers.rs; do
            printf '%s ' "$file" >> evidence/source-blobs.txt
            git hash-object "$source/migration/$file" >> evidence/source-blobs.txt
          done
          git ls-tree HEAD crates/franken-node/tests/native_rewrite_transactions.rs >> evidence/source-blobs.txt
          rustfmt +stable --edition 2024 --emit stdout "$source/migration/module_specifiers.rs" > evidence/module_specifiers.formatted.rs
          cargo +stable check --manifest-path "$primary/Cargo.toml" --lib 2>&1 | tee evidence/primary-check.log
          cargo +stable test --manifest-path "$tests/Cargo.toml" -- --nocapture --test-threads=2 2>&1 | tee evidence/esm-tests.log
          cargo +stable clippy --manifest-path "$primary/Cargo.toml" --lib -- -D warnings 2>&1 | tee evidence/primary-clippy.log
          cargo +stable clippy --manifest-path "$tests/Cargo.toml" --all-targets -- -D warnings 2>&1 | tee evidence/esm-clippy.log
          cp "$tests/Cargo.lock" evidence/Cargo.lock
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          checked = tomllib.loads(Path('evidence/Cargo.lock').read_text())['package']
          actual = tomllib.loads(Path('Cargo.lock').read_text())['package']
          name = 'tree-sitter-typescript'
          expected = next(p for p in checked if p['name'] == name)
          declared = next(p for p in actual if p['name'] == name)
          assert declared == expected, (declared, expected)
          product = next(p for p in actual if p['name'] == 'frankenengine-node')
          assert name in product['dependencies']
          print('Root TypeScript grammar lock entry matches Cargo-resolved and executed dependency.')
          PY
      - name: Commit only tested integration directly to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add crates/franken-node/src/migration/mod.rs crates/franken-node/src/migration/module_specifiers.rs crates/franken-node/Cargo.toml Cargo.lock .github/workflows/native-migration-validation.yml .github/workflows/native-rewrite-transaction.yml .github/workflows/verified-rewrite.yml
          if ! git diff --cached --quiet; then
            git config user.name 'ChatGPT'
            git config user.email 'noreply@openai.com'
            git commit -m 'feat(migration): support typed TypeScript and TSX without type erasure or module conversion' -m 'Use explicit grammars and preserve type/value import modifiers, annotations, JSX and declarations. Recognize mts/cts in primary audit and rewrite. Refuse ambiguous CommonJS and ambient-module forms. All transformer/public API tests and Clippy passed on these exact source blobs; native engine compatibility not claimed.'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > evidence/published-revision.txt
      - name: Preserve exact executed sources and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esm-rewrite-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/
            crates/franken-node/src/migration/mod.rs
            crates/franken-node/src/migration/module_specifiers.rs
            crates/franken-node/tests/native_rewrite_transactions.rs
            crates/franken-node/Cargo.toml
            Cargo.lock
