name: ESM module rewriting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/esm-module-rewrite.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/native_rewrite_transactions.rs'
      - 'crates/franken-node/tests/typed_module_rewrites.rs'
  pull_request:
    paths:
      - '.github/workflows/esm-module-rewrite.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/native_rewrite_transactions.rs'
      - 'crates/franken-node/tests/typed_module_rewrites.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esm-rewrites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Stage declaration-safe inventory and test registration on exact captured inputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [ "$(git hash-object crates/franken-node/src/migration/validation_suite.rs)" = 4489679fd5c9f41d1392117852179a4cdf72db72 ]; then
            test "$(git hash-object crates/franken-node/src/migration/test_inventory.rs)" = 9f7ac917a2c7ad9a55a48589c4369d9ed8bffa99
            for blob in 1516abeea12212b81a4b97269c90b266f148ffbd e97e9c290b0f68b6257072d2444a6ae786cb8ffb; do
              gh api "repos/Dicklesworthstone/franken_node/git/blobs/$blob" --jq .content | base64 --decode > "evidence/$blob.patch"
              test "$(git hash-object "evidence/$blob.patch")" = "$blob"
              git apply --recount --check "evidence/$blob.patch"
              git apply --recount "evidence/$blob.patch"
            done
            git diff --check
          fi
      - name: Compile primary source and execute real typed rewrite and rollback tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          primary="$RUNNER_TEMP/esm-primary"
          tests="$RUNNER_TEMP/esm-tests"
          source="$GITHUB_WORKSPACE/crates/franken-node/src"
          mkdir -p "$primary" "$tests" evidence
          cat > "$primary/Cargo.toml" <<'TOML'
          [package]
          name = "esm-primary"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          name = "frankenengine_node"
          path = "lib.rs"
          test = false
          doctest = false
          [features]
          admin-tools = []
          [dependencies]
          anyhow = "1.0"
          thiserror = "2.0"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          sha2 = "0.11"
          hex = "0.4"
          chrono = "0.4"
          tempfile = "3"
          tree-sitter = "0.26.8"
          tree-sitter-javascript = "0.25.0"
          tree-sitter-typescript = "=0.23.2"
          rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
          TOML
          cat > "$primary/lib.rs" <<RUST
          #![forbid(unsafe_code)]
          extern crate self as frankenengine_node;
          #[path = "$source/config/timeouts.rs"]
          pub mod production_timeouts;
          pub mod config { pub use crate::production_timeouts as timeouts; }
          #[path = "$source/migration/mod.rs"]
          pub mod migration;
          RUST
          cat > "$tests/Cargo.toml" <<TOML
          [package]
          name = "esm-rewrite-tests"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          path = "lib.rs"
          [[test]]
          name = "primary_rewrites"
          path = "$GITHUB_WORKSPACE/crates/franken-node/tests/native_rewrite_transactions.rs"
          [[test]]
          name = "typed_module_rewrites"
          path = "$GITHUB_WORKSPACE/crates/franken-node/tests/typed_module_rewrites.rs"
          [dependencies]
          frankenengine_node = { package = "esm-primary", path = "$primary" }
          tempfile = "3"
          serde_json = "1.0"
          sha2 = "0.11"
          hex = "0.4"
          tree-sitter = "0.26.8"
          tree-sitter-javascript = "0.25.0"
          tree-sitter-typescript = "=0.23.2"
          TOML
          cat > "$tests/lib.rs" <<RUST
          #![forbid(unsafe_code)]
          #[cfg(test)]
          #[path = "$source/migration/module_specifiers.rs"]
          mod module_specifiers;
          RUST
          git rev-parse HEAD > evidence/revision.txt
          node --version > evidence/node-version.txt
          bun --version > evidence/bun-version.txt
          rustc +stable --version > evidence/rust-version.txt
          for file in mod.rs module_specifiers.rs source_syntax.rs validation_suite.rs test_inventory.rs; do
            printf '%s ' "$file" >> evidence/source-blobs.txt
            git hash-object "$source/migration/$file" >> evidence/source-blobs.txt
          done
          rustfmt +stable --edition 2024 --emit stdout "$source/migration/module_specifiers.rs" > evidence/module_specifiers.formatted.rs
          cargo +stable check --manifest-path "$primary/Cargo.toml" --lib 2>&1 | tee evidence/primary-check.log
          cargo +stable test --manifest-path "$tests/Cargo.toml" -- --nocapture --test-threads=2 2>&1 | tee evidence/esm-tests.log
          cargo +stable clippy --manifest-path "$primary/Cargo.toml" --lib -- -D warnings 2>&1 | tee evidence/primary-clippy.log
          cargo +stable clippy --manifest-path "$tests/Cargo.toml" --all-targets -- -D warnings 2>&1 | tee evidence/esm-clippy.log
          cargo +stable test --manifest-path tools/migration-validator/Cargo.toml -- --nocapture --test-threads=2 2>&1 | tee evidence/suite-tests.log
          cargo +stable clippy --manifest-path tools/migration-validator/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/suite-clippy.log
          cp "$tests/Cargo.lock" evidence/Cargo.lock
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          checked = tomllib.loads(Path('evidence/Cargo.lock').read_text())['package']
          actual = tomllib.loads(Path('Cargo.lock').read_text())['package']
          name = 'tree-sitter-typescript'
          assert next(p for p in checked if p['name'] == name) == next(p for p in actual if p['name'] == name)
          assert name in next(p for p in actual if p['name'] == 'frankenengine-node')['dependencies']
          product = tomllib.loads(Path('crates/franken-node/Cargo.toml').read_text())
          assert any(t['name'] == 'typed_module_rewrites' for t in product['test'])
          PY
      - name: Commit only tested inventory and test registration directly to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/franken-node/src/migration/validation_suite.rs crates/franken-node/src/migration/test_inventory.rs crates/franken-node/Cargo.toml .github/workflows/native-migration-validation.yml .github/workflows/native-rewrite-transaction.yml .github/workflows/verified-rewrite.yml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(migration): include JSX tests and exclude declaration-only coverage' -m 'Primary typed migration APIs, exact rollback, real Node/Bun reference execution, full operator suite and strict lint verified before publication. Native engine qualification is not claimed.'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main
          fi
          git rev-parse HEAD > evidence/published-revision.txt
      - name: Preserve exact executed sources and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esm-rewrite-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/
            crates/franken-node/src/migration/mod.rs
            crates/franken-node/src/migration/module_specifiers.rs
            crates/franken-node/src/migration/source_syntax.rs
            crates/franken-node/src/migration/validation_suite.rs
            crates/franken-node/src/migration/test_inventory.rs
            crates/franken-node/tests/typed_module_rewrites.rs
            crates/franken-node/Cargo.toml
            Cargo.lock
