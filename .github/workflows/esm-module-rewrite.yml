          -            manual_findings: manual_findings.into_iter().collect(),
          -        };
          -    }
          -
          -    let mut rewritten_content = String::with_capacity(source.len());
          -    let mut rewrite_count = 0_usize;
          -    for line in source.split_inclusive('\n') {
