name: Rollout source recovery

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/src/runtime/nversion_oracle.rs'
      - 'crates/franken-node/src/security/constant_time.rs'
      - 'crates/franken-node/src/lib.rs'
      - '.github/workflows/rollout-source-recovery.yml'
  pull_request:
    paths:
      - 'crates/franken-node/src/migration/**'
      - '.github/workflows/rollout-source-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and exercise actual rollout and native transaction modules
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          harness="$RUNNER_TEMP/rollout-source-recovery"
          source="$GITHUB_WORKSPACE/crates/franken-node/src"
          mkdir -p "$harness" evidence
          cat > "$harness/Cargo.toml" <<'TOML'
          [package]
          name = "rollout-source-recovery"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          path = "lib.rs"
          [dependencies]
          anyhow = "1.0"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          sha2 = "0.11.0"
          hex = "0.4.3"
          chrono = "0.4.40"
          fs2 = "0.4.3"
          tempfile = "3"
          subtle = "2.6.1"
          proptest = "1.6"
          tree-sitter = "0.26.8"
          tree-sitter-javascript = "0.25.0"
          rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
          TOML
          # Import exact production helper definitions. The oracle's inline
          # tests need the real poisoning/error behavior of lock_utils too.
          # No repository source, test filter or assertion is rewritten.
          {
            sed -n '/^const MAX_HELP_URLS:/p' "$source/lib.rs"
            sed -n '/^pub(crate) fn push_bounded<T>/,/^}/p' "$source/lib.rs"
            sed -n '/^#\[derive(Debug, Clone, PartialEq, Eq, Hash)\]/,/^impl std::error::Error for ActionableError {}/p' "$source/lib.rs"
            sed -n '/^pub mod lock_utils {/,/^}/p' "$source/lib.rs"
          } > "$harness/bounded.rs"
          test "$(grep -c '^const MAX_HELP_URLS:' "$harness/bounded.rs")" = 1
          test "$(grep -c '^pub(crate) fn push_bounded<T>' "$harness/bounded.rs")" = 1
          test "$(grep -c '^pub struct ActionableError' "$harness/bounded.rs")" = 1
          test "$(grep -c '^impl std::error::Error for ActionableError' "$harness/bounded.rs")" = 1
          test "$(grep -c '^pub mod lock_utils' "$harness/bounded.rs")" = 1
          cat > "$harness/lib.rs" <<RUST
          #![forbid(unsafe_code)]
          extern crate self as frankenengine_node;
          include!("bounded.rs");
          #[path = "$source/security/constant_time.rs"]
          pub mod production_constant_time;
          pub mod security { pub use crate::production_constant_time as constant_time; }
          #[path = "$source/runtime/nversion_oracle.rs"]
          pub mod production_oracle;
          pub mod runtime { pub use crate::production_oracle as nversion_oracle; }
          pub mod migration {
              #[path = "$source/migration/smoke_supervisor.rs"]
              pub mod smoke_supervisor;
              #[path = "$source/migration/validation_suite.rs"]
              pub mod validation_suite;
              #[path = "$source/migration/rewrite_transaction.rs"]
              pub mod rewrite_transaction;
              pub use rewrite_transaction::rollback;
              #[path = "$source/migration/rollout.rs"]
              pub mod rollout;
          }
          RUST
          git rev-parse HEAD > evidence/revision.txt
          rustc +stable --version > evidence/rust-version.txt
          node --version > evidence/node-version.txt
          git ls-tree -r HEAD crates/franken-node/src/migration/ crates/franken-node/src/runtime/nversion_oracle.rs crates/franken-node/src/security/constant_time.rs crates/franken-node/src/lib.rs > evidence/source-blobs.txt
          cargo +stable check --manifest-path "$harness/Cargo.toml" --lib 2>&1 | tee evidence/check.log
          # Preserve both original module test sets. The newly imported full
          # validation suite compiles too; its own workflow executes that suite.
          cargo +stable test --manifest-path "$harness/Cargo.toml" migration::rollout:: -- --nocapture --test-threads=2 2>&1 | tee evidence/recovery-tests.log
          cargo +stable test --manifest-path "$harness/Cargo.toml" migration::rewrite_transaction:: -- --nocapture --test-threads=2 2>&1 | tee evidence/transaction-tests.log
          cargo +stable clippy --manifest-path "$harness/Cargo.toml" --lib -- -D warnings 2>&1 | tee evidence/clippy.log
          for file in rollout.rs rollout_cohort.rs rollout_store.rs rollout_recovery_tests.rs rewrite_rollback.rs; do
            rustfmt +stable --edition 2024 --config skip_children=true --emit stdout "$source/migration/$file" > "evidence/$file"
          done
      - name: Retain exact source and recovery execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-source-recovery-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/
            crates/franken-node/src/migration/
