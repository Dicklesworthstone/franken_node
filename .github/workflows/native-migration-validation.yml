name: Native migration validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-migration-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-reviewed-native-fixes:
    if: github.repository == 'Dicklesworthstone/franken_node' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify original source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:crates/franken-node/src/migration/mod.rs)" = c2546567a970e5e104674e9de1e797e1c9e086d3
          test "$(git rev-parse HEAD:crates/franken-node/tests/migrate_cli_e2e.rs)" = 427a31610ff2f3d608a179d63119774f37e85104
      - name: Install Rust parser and formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply reviewed patches and commit each directly to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          patches=(b8b4cf6659e37994ed247db9884fc6e69e034ffa 9233f44c5342e4ea1acdadfcef33152b52f903a2)
          messages=('fix(migration): never substitute reference success for native admission' 'fix(migration): bound native smoke streams and reject overflow')
          for index in 0 1; do
            sha="${patches[$index]}"
            patch="$RUNNER_TEMP/native-migration-$index.patch"
            gh api "repos/Dicklesworthstone/franken_node/git/blobs/$sha" --jq .content | base64 --decode > "$patch"
            test "$(git hash-object "$patch")" = "$sha"
            git apply --recount --check "$patch"
            git apply --recount "$patch"
            while IFS= read -r path; do
              case "$path" in
                crates/franken-node/src/migration/mod.rs|crates/franken-node/tests/migrate_cli_e2e.rs) ;;
                *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
              esac
              rustfmt +stable --edition 2024 --config skip_children=true --emit stdout "$path" > /dev/null
            done < <(git diff --name-only)
            git diff --check
            git add -- crates/franken-node/src/migration/mod.rs crates/franken-node/tests/migrate_cli_e2e.rs
            git commit -m "${messages[$index]}" -m "Reviewed patch blob: $sha. Full-file Rust parsing and whitespace checks passed. Native Cargo regression execution is tracked separately; no passing build claim is made by this commit."
            git push origin HEAD:main
            echo "Published $(git rev-parse HEAD)"
          done
