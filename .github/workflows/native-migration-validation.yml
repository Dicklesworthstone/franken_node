name: Native migration validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-migration-validation.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/migrate_cli_e2e.rs'
      - 'crates/franken-node/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/native-migration-validation.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/migrate_cli_e2e.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: franken_node
          persist-credentials: false
      - name: Checkout declared sibling development dependencies
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C franken_node rev-parse HEAD > evidence/franken_node.revision
          for repo in franken_engine frankentui fastapi_rust sqlmodel_rust asupersync frankensqlite; do
            git clone --depth 1 "https://github.com/Dicklesworthstone/$repo.git" "$repo"
            git -C "$repo" rev-parse HEAD > "evidence/$repo.revision"
          done
          # The checked-in dev-dependencies explicitly use /dp paths. Supply
          # their real checkouts, never edit manifests or substitute stubs.
          sudo mkdir -p /dp
          for repo in franken_node franken_engine frankentui fastapi_rust sqlmodel_rust asupersync frankensqlite; do
            sudo ln -s "$GITHUB_WORKSPACE/$repo" "/dp/$repo"
          done
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable --version | tee evidence/rust-version.txt
      - name: Parse complete modified Rust files
        working-directory: franken_node
        run: |
          set -euo pipefail
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout crates/franken-node/src/migration/mod.rs > /dev/null
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout crates/franken-node/tests/migrate_cli_e2e.rs > /dev/null
      - name: Compile and run native admission regressions
        working-directory: franken_node
        run: |
          set -euo pipefail
          cargo +stable test -p frankenengine-node --features test-support --test migrate_cli_e2e native_smoke_admission_regressions -- --nocapture 2>&1 | tee ../evidence/native-admission.log
          cargo +stable test -p frankenengine-node --features test-support --test migrate_cli_e2e migrate_validate_native_failure_never_launches_hanging_reference -- --nocapture 2>&1 | tee ../evidence/no-reference-fallback.log
          cargo +stable test -p frankenengine-node --features test-support --test migrate_cli_e2e migrate_validate_passes_for_hardened_project -- --nocapture 2>&1 | tee ../evidence/native-positive-smoke.log
      - name: Preserve exact source and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-migration-evidence
          path: |
            evidence/
            franken_node/crates/franken-node/src/migration/mod.rs
            franken_node/crates/franken-node/tests/migrate_cli_e2e.rs
          retention-days: 7
          if-no-files-found: error
