name: Native migration validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-migration-validation.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/migrate_cli_e2e.rs'
      - 'crates/franken-node/tests/native_project_suite_cli.rs'
      - 'tools/migration-validator/**'
      - 'crates/franken-node/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/native-migration-validation.yml'
      - 'crates/franken-node/src/migration/**'
      - 'crates/franken-node/tests/migrate_cli_e2e.rs'
      - 'crates/franken-node/tests/native_project_suite_cli.rs'
      - 'tools/migration-validator/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-module:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the complete primary module with its real configuration
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p evidence "$RUNNER_TEMP/primary-migration/tests"
          harness="$RUNNER_TEMP/primary-migration"
          source_root="$GITHUB_WORKSPACE/crates/franken-node/src"
          cat > "$harness/Cargo.toml" <<'TOML'
          [package]
          name = "primary-migration-check"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          path = "lib.rs"
          test = false
          doctest = false
          [features]
          admin-tools = []
          [dependencies]
          anyhow = "1.0"
          thiserror = "2.0"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          sha2 = "0.11.0"
          hex = "0.4.3"
          chrono = "0.4.40"
          tempfile = "3"
          tree-sitter = "0.26.8"
          tree-sitter-javascript = "0.25.0"
          tree-sitter-typescript = "=0.23.2"
          rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
          TOML
          cat > "$harness/lib.rs" <<RUST
          #![forbid(unsafe_code)]
          extern crate self as frankenengine_node;
          #[path = "$source_root/config/timeouts.rs"]
          pub mod production_timeouts;
          pub mod config { pub use crate::production_timeouts as timeouts; }
          #[path = "$source_root/migration/mod.rs"]
          pub mod migration;
          RUST
          cat > "$harness/tests/primary_dispatch.rs" <<'RUST'
          use primary_migration_check::migration::{self, MigrationValidateReport};
          use std::path::Path;

          fn project() -> tempfile::TempDir {
              let root = tempfile::tempdir().unwrap();
              std::fs::write(root.path().join("package.json"),
                  r#"{"name":"fixture","engines":{"node":">=20"}}"#).unwrap();
              std::fs::write(root.path().join("package-lock.json"), "{}\n").unwrap();
              std::fs::write(root.path().join("case.test.js"),
                  "require('fs').writeFileSync('executed','unexpected');\n").unwrap();
              root
          }

          fn no_guest_effects(root: &Path) {
              assert!(!root.join("executed").exists());
              assert!(!root.join(".franken-node").exists());
          }

          #[test]
          fn static_only_preserves_the_four_check_contract_without_execution() {
              let root = project();
              let report = migration::run_validate(root.path(), true).unwrap();
              assert!(report.is_pass());
              assert_eq!(report.checks.len(), 4);
              assert!(report.test_suite.is_none());
              no_guest_effects(root.path());
          }

          #[test]
          fn static_prerequisite_failure_does_not_launch_a_runtime() {
              let root = project();
              std::fs::write(root.path().join("package.json"),
                  r#"{"name":"blocked","scripts":{"postinstall":"echo blocked"}}"#).unwrap();
              let report = migration::run_validate(root.path(), false).unwrap();
              assert!(!report.is_pass());
              assert_eq!(report.checks.len(), 5);
              assert!(!report.checks[4].passed);
              assert!(report.checks[4].message.contains("static validation checks failed"));
              assert!(report.test_suite.is_none());
              no_guest_effects(root.path());
          }

          #[test]
          fn primary_validation_and_report_refuse_invalid_suite_capture() {
              let root = project();
              let outside = tempfile::NamedTempFile::new().unwrap();
              std::os::unix::fs::symlink(outside.path(), root.path().join("outside-link")).unwrap();
              let report = migration::run_one_command_report(root.path()).unwrap();
              assert!(!report.validation.is_pass());
              assert!(report.validation.checks[4].message.contains("symlink"));
              assert!(report.validation.test_suite.is_none());
              assert_eq!(report.executive_summary.go_no_go, "no_go");
              let rollout = report.rollout_plan.phases.iter().find(|p| p.name == "rollout").unwrap();
              assert_eq!(rollout.status, "blocked");
              no_guest_effects(root.path());
          }

          #[test]
          fn reports_without_suite_evidence_still_round_trip() {
              let root = project();
              let report = migration::run_validate(root.path(), true).unwrap();
              let encoded = serde_json::to_value(&report).unwrap();
              assert!(encoded.get("test_suite").is_none());
              let decoded: MigrationValidateReport = serde_json::from_value(encoded).unwrap();
              assert_eq!(decoded, report);
          }
          RUST
          git rev-parse HEAD > evidence/franken_node.revision
          git ls-tree HEAD crates/franken-node/src/migration/mod.rs crates/franken-node/src/migration/syntax_reduction.rs crates/franken-node/src/config/timeouts.rs crates/franken-node/tests/native_project_suite_cli.rs > evidence/primary-source-blobs.txt
          rustc +stable --version > evidence/primary-rust-version.txt
          node --version > evidence/primary-node-version.txt
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout "$source_root/migration/mod.rs" > /dev/null
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout crates/franken-node/tests/native_project_suite_cli.rs > /dev/null
          cargo +stable test --manifest-path tools/migration-validator/Cargo.toml syntax_reduction -- --nocapture --test-threads=2 2>&1 | tee evidence/syntax-reduction-tests.log
          cargo +stable test --manifest-path tools/migration-validator/Cargo.toml minified_product_sources_reduce_without_dropping_either_tree_or_reference -- --nocapture 2>&1 | tee evidence/syntax-multi-tree-regression.log
          cargo +stable clippy --manifest-path tools/migration-validator/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/syntax-reduction-clippy.log
          cargo +stable check --manifest-path "$harness/Cargo.toml" --lib 2>&1 | tee evidence/primary-module-check.log
          cargo +stable test --manifest-path "$harness/Cargo.toml" --test primary_dispatch -- --nocapture 2>&1 | tee evidence/primary-dispatch-tests.log
          cargo +stable clippy --manifest-path "$harness/Cargo.toml" --lib -- -D warnings 2>&1 | tee evidence/primary-module-clippy.log
      - name: Preserve primary module evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-migration-module-evidence
          path: |
            evidence/
            crates/franken-node/src/migration/mod.rs
            crates/franken-node/src/migration/syntax_reduction.rs
            crates/franken-node/src/config/timeouts.rs
            crates/franken-node/tests/native_project_suite_cli.rs
          retention-days: 7
          if-no-files-found: error

  focused-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test the actual native suite operator
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p evidence
          rustc +stable --version > evidence/rust-version.txt
          node --version > evidence/node-version.txt
          git rev-parse HEAD > evidence/franken_node.revision
          git ls-tree HEAD crates/franken-node/src/migration/validation_suite.rs crates/franken-node/src/migration/workspace_effects.rs crates/franken-node/src/migration/paired_validation_tests.rs crates/franken-node/src/migration/smoke_supervisor.rs tools/migration-validator/Cargo.toml tools/migration-validator/main.rs > evidence/source-blobs.txt
          rustfmt +stable --edition 2024 --emit stdout crates/franken-node/src/migration/validation_suite.rs > evidence/validation_suite.formatted.rs
          rustfmt +stable --edition 2024 --config skip_children=true --emit stdout tools/migration-validator/main.rs > evidence/main.formatted.rs
          cargo +stable test --manifest-path tools/migration-validator/Cargo.toml -- --nocapture --test-threads=2 2>&1 | tee evidence/suite-tests.log
          cargo +stable clippy --manifest-path tools/migration-validator/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/suite-clippy.log
          cargo +stable build --manifest-path tools/migration-validator/Cargo.toml 2>&1 | tee evidence/suite-build.log
      - name: Exercise executable CLI exit and report behavior
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/tools/migration-validator/target/debug/franken-migration-suite"
          project="$RUNNER_TEMP/suite-cli-project"
          candidate="$RUNNER_TEMP/suite-cli-candidate"
          mkdir -p "$project" "$candidate"
          printf "require('fs').writeFileSync('artifact','original');\n" > "$project/case.test.js"
          printf "require('fs').writeFileSync('artifact','rewritten');\n" > "$candidate/case.test.js"
          # /bin/false is a deliberate executable failure, not a Franken stand-in.
          set +e
          "$binary" "$project" --migrated-project "$candidate" --compare-filesystem --native-bin /bin/false --execute --out "$GITHUB_WORKSPACE/evidence/measured-failure.json" > evidence/cli-failure.json
          measured_exit=$?
          "$binary" "$project" --native-bin /bin/false > evidence/cli-no-consent.json
          consent_exit=$?
          set -e
          test "$measured_exit" = 1
          test "$consent_exit" = 2
          test ! -e "$project/artifact"
          test ! -e "$candidate/artifact"
          python3 - <<'PY'
          import json
          from pathlib import Path
          measured = json.loads(Path('evidence/measured-failure.json').read_text())
          consent = json.loads(Path('evidence/cli-no-consent.json').read_text())
          assert measured['verdict'] == 'FAIL' and measured['failed'] == 1
          assert measured['cases'][0]['reference']['exit_code'] == 0
          assert measured['cases'][0]['native']['exit_code'] == 1
          assert measured['input_sha256'] != measured['candidate_input_sha256']
          assert measured['filesystem_comparison'] is True
          assert measured['filesystem_exclusions'] == ['**/.git', '.franken-node']
          assert measured['cases'][0]['reference']['workspace_delta']['changed_paths'] == 1
          assert measured['cases'][0]['native']['workspace_delta']['changed_paths'] == 0
          assert 'filesystem:workspace_delta_mismatch' in measured['cases'][0]['divergences']
          assert measured['release_certification'] is False
          assert consent['verdict'] == 'ERROR' and '--execute' in consent['error']
          assert Path('evidence/measured-failure.json').stat().st_mode & 0o777 == 0o600
          print('Paired-input CLI: measured filesystem failure exit 1; no-consent exit 2; unchanged inputs and private report verified.')
          PY
      - name: Preserve exact source and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-suite-evidence
          path: |
            evidence/
            tools/migration-validator/Cargo.toml
            tools/migration-validator/Cargo.lock
            tools/migration-validator/main.rs
            crates/franken-node/src/migration/validation_suite.rs
            crates/franken-node/src/migration/workspace_effects.rs
            crates/franken-node/src/migration/paired_validation_tests.rs
            crates/franken-node/src/migration/smoke_supervisor.rs
          retention-days: 7
          if-no-files-found: error

  native-admission:
    concurrency:
      group: native-application-migration-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: franken_node
          persist-credentials: false
      - name: Checkout declared sibling development dependencies
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C franken_node rev-parse HEAD > evidence/franken_node.revision
          for repo in franken_engine frankentui fastapi_rust sqlmodel_rust asupersync frankensqlite; do
            git clone --depth 1 "https://github.com/Dicklesworthstone/$repo.git" "$repo"
            git -C "$repo" rev-parse HEAD > "evidence/$repo.revision"
          done
          sudo mkdir -p /dp
          for repo in franken_node franken_engine frankentui fastapi_rust sqlmodel_rust asupersync frankensqlite; do
            sudo ln -s "$GITHUB_WORKSPACE/$repo" "/dp/$repo"
          done
      - name: Install Rust required by fsqlite-pager
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          rustc +nightly --version | tee evidence/rust-version.txt
      - name: Parse complete native application files
        working-directory: franken_node
        run: |
          set -euo pipefail
          for path in crates/franken-node/src/migration/mod.rs crates/franken-node/src/migration/smoke_supervisor.rs crates/franken-node/src/migration/validation_suite.rs crates/franken-node/tests/migrate_cli_e2e.rs crates/franken-node/tests/native_project_suite_cli.rs; do
            rustfmt +nightly --edition 2024 --config skip_children=true --emit stdout "$path" > /dev/null
          done
      - name: Compile and run native admission regressions
        working-directory: franken_node
        run: |
          set -euo pipefail
          cargo +nightly test -p frankenengine-node --features test-support --test migrate_cli_e2e native_project_suite_cli -- --nocapture --test-threads=2 2>&1 | tee ../evidence/primary-suite-cli.log
          cargo +nightly test -p frankenengine-node --features test-support --test migrate_cli_e2e native_smoke_admission_regressions -- --nocapture 2>&1 | tee ../evidence/native-admission.log
          cargo +nightly test -p frankenengine-node --features test-support --test migrate_cli_e2e native_smoke_supervisor -- --nocapture 2>&1 | tee ../evidence/native-supervisor-integration.log
          cargo +nightly test -p frankenengine-node --features test-support --test migrate_cli_e2e migrate_validate_native_failure_never_launches_hanging_reference -- --nocapture 2>&1 | tee ../evidence/no-reference-fallback.log
          cargo +nightly test -p frankenengine-node --features test-support --test migrate_cli_e2e migrate_validate_passes_for_hardened_project -- --nocapture 2>&1 | tee ../evidence/native-positive-smoke.log
      - name: Preserve native application build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-migration-evidence
          path: |
            evidence/
            franken_node/Cargo.lock
            franken_node/crates/franken-node/src/migration/mod.rs
            franken_node/crates/franken-node/src/migration/smoke_supervisor.rs
            franken_node/crates/franken-node/src/migration/validation_suite.rs
            franken_node/crates/franken-node/tests/migrate_cli_e2e.rs
            franken_node/crates/franken-node/tests/native_project_suite_cli.rs
          retention-days: 7
          if-no-files-found: error
