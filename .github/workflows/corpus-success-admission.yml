name: Corpus successful execution admission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corpus-success-admission.yml'
      - 'crates/franken-node/src/ops/compat_corpus_run.rs'
      - 'crates/franken-node/src/ops/close_condition.rs'
      - 'scripts/check_compatibility_corpus_pass_gate.py'
      - 'tests/test_check_compatibility_corpus_pass_gate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source corrections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/admission.patch <<'PATCH'
