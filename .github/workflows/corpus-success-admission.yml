      - name: Compile actual Rust admission, writer and digest functions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          harness="$RUNNER_TEMP/corpus-admission"
          mkdir -p "$harness"
          export SOURCE_ROOT="$GITHUB_WORKSPACE/crates/franken-node/src"
          cat > "$harness/Cargo.toml" <<'TOML'
          [package]
          name = "corpus-admission-check"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [lib]
          path = "lib.rs"
          doctest = false
          [features]
          default = ["engine"]
          engine = []
          [dependencies]
          anyhow = "1.0"
