name: Corpus successful execution admission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corpus-success-admission.yml'
      - 'crates/franken-node/src/ops/compat_corpus_run.rs'
      - 'crates/franken-node/src/ops/close_condition.rs'
      - 'scripts/check_compatibility_corpus_pass_gate.py'
      - 'tests/test_check_compatibility_corpus_pass_gate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore the immutable reviewed patch and test harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch --depth=1 origin 02cd2a7c98aee1bfa904b803677417bfd6d3fb1f
          git show 02cd2a7c98aee1bfa904b803677417bfd6d3fb1f:.github/workflows/corpus-success-admission.yml > evidence/reviewed-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('evidence/reviewed-workflow.yml').read_text().splitlines()
          def extract_step(name, output):
              marker = '      - name: ' + name
              assert lines.count(marker) == 1
              index = lines.index(marker) + 1
              while lines[index] != '        run: |':
                  index += 1
              index += 1
              code = []
              while index < len(lines) and (not lines[index] or lines[index].startswith('          ')):
                  code.append(lines[index][10:])
                  index += 1
              assert code and code[0] == 'set -euo pipefail'
              Path(output).write_text('\n'.join(code) + '\n')
          extract_step('Apply reviewed source corrections', 'evidence/apply-reviewed.sh')
          extract_step('Compile actual Rust admission, writer and digest functions', 'evidence/test-rust.sh')
          PY
          bash evidence/apply-reviewed.sh
      - name: Apply report-scoped summary validation
        shell: bash
        run: |
          set -euo pipefail
          cat > evidence/summary-scope.patch <<'PATCH'
          diff --git a/scripts/check_compatibility_corpus_pass_gate.py b/scripts/check_compatibility_corpus_pass_gate.py
          --- a/scripts/check_compatibility_corpus_pass_gate.py
          +++ b/scripts/check_compatibility_corpus_pass_gate.py
          @@ -489,25 +489,64 @@
          -def check_summary(report_path: Path, data: dict | None, results_generated_at: "str | None") -> list[dict]:
          +def check_summary(report_path: Path, data: dict | None, results_generated_at: "str | None",
          +                  summary_path: Path | None = None) -> list[dict]:
               """Filesystem-facing wrapper: load SUMMARY and evaluate it against the
               recomputed rate from `data`. Emits nothing when the report itself is
               unloadable — the report checks already fail for that case."""
               checks: list[dict] = []
               if data is None:
                   return checks
          -    if not SUMMARY.exists():
          +    canonical_report = report_path.resolve() == REPORT.resolve()
          +    if summary_path is None and not canonical_report:
          +        return [{"check": "summary: report scope", "pass": True,
          +                 "detail": "custom report only; no charter summary asserted (use --summary to verify a bound summary)"}]
          +    # The canonical release report always requires the canonical charter
          +    # metric, even if a caller supplies another summary. Explicit summaries
          +    # are additional evidence, never a way to bypass the canonical binding.
          +    selected = [SUMMARY] if canonical_report else []
          +    if summary_path is not None and all(path.resolve() != summary_path.resolve() for path in selected):
          +        selected.append(summary_path)
          +    for selected_path in selected:
          +        checks.extend(check_bound_summary(selected_path, report_path, data, results_generated_at))
          +    return checks
          +
          +
          +def check_bound_summary(summary_path: Path, report_path: Path, data: dict,
          +                        results_generated_at: "str | None") -> list[dict]:
          +    checks: list[dict] = []
          +    if not summary_path.exists():
                   checks.append({
                       "check": "summary: charter metric artifact exists",
                       "pass": False,
          -            "detail": f"MISSING: {SUMMARY}",
          +            "detail": f"MISSING: {summary_path}",
                   })
                   return checks
               try:
          -        summary = json.loads(SUMMARY.read_text(encoding="utf-8"))
          -    except json.JSONDecodeError:
          +        summary = json.loads(summary_path.read_text(encoding="utf-8"))
          +        if not isinstance(summary, dict):
          +            raise ValueError("summary must be a JSON object")
          +    except (OSError, ValueError) as error:
                   checks.append({
                       "check": "summary: valid json",
                       "pass": False,
          -            "detail": f"unparseable: {SUMMARY}",
          +            "detail": f"unreadable or invalid summary {summary_path}: {error}",
                   })
                   return checks
          -    checks.append({"check": "summary: valid json", "pass": True, "detail": str(SUMMARY)})
          +    checks.append({"check": "summary: valid json", "pass": True, "detail": str(summary_path)})
          +    metric = summary.get("metric")
          +    reference = metric.get("details_ref") if isinstance(metric, dict) else None
          +    try:
          +        target = Path(reference) if isinstance(reference, str) and reference else None
          +        # Existing charter references are repository-relative; explicit
          +        # external summaries may use an absolute report path.
          +        bound = target is not None and (target if target.is_absolute() else ROOT / target).resolve() == report_path.resolve()
          +    except (OSError, ValueError, RuntimeError):
          +        bound = False
          +    checks.append({"check": "summary: bound to selected report", "pass": bound,
          +                   "detail": f"summary={summary_path} details_ref={reference!r} report={report_path}"})
           
               per_tests = data.get("per_test_results", [])
          @@ -910,6 +910,7 @@
           def run_checks(
               report_path: Path = REPORT,
               minimum_cases: int = DEFAULT_MIN_CASES,
          +    summary_path: Path | None = None,
           ) -> dict:
               checks = []
          @@ -929,3 +930,3 @@
          -    checks.extend(check_summary(report_path, data, generated_at))
          +    checks.extend(check_summary(report_path, data, generated_at, summary_path))
               checks.extend(check_ifc_regression(data))
          @@ -940,3 +941,4 @@
                   "report_path": str(report_path),
          +        "summary_path": str(summary_path) if summary_path is not None else (str(SUMMARY) if report_path.resolve() == REPORT.resolve() else None),
                   "minimum_cases": minimum_cases,
          @@ -1033,6 +1034,9 @@
                   help="compatibility corpus report to validate",
               )
          +    parser.add_argument("--summary", type=Path,
          +                        help="also validate a charter summary bound to --report; canonical report always checks its canonical summary")
               parser.add_argument(
                   "--min-cases",
          @@ -1070,3 +1074,3 @@
          -    result = run_checks(args.report, args.min_cases)
          +    result = run_checks(args.report, args.min_cases, args.summary)
               if args.json:
                   print(json.dumps(result, indent=2))
          diff --git a/tests/test_check_compatibility_corpus_pass_gate.py b/tests/test_check_compatibility_corpus_pass_gate.py
          --- a/tests/test_check_compatibility_corpus_pass_gate.py
          +++ b/tests/test_check_compatibility_corpus_pass_gate.py
          @@ -410,6 +410,94 @@
          -class TestConstants(unittest.TestCase):
          +class TestSummaryReportBinding(unittest.TestCase):
          +    def setUp(self):
          +        self.scratch = tempfile.TemporaryDirectory()
          +        self.addCleanup(self.scratch.cleanup)
          +        self.root = Path(self.scratch.name)
          +        self.report_path = self.root / "report.json"
          +        self.report = passing_report()
          +        write_report(self.report_path, self.report)
          +        self.summary_path = self.root / "summary.json"
          +
          +    def summary(self, **metric_overrides):
          +        metric = {"observed_pct": 100.0, "details_ref": str(self.report_path)}
          +        metric.update(metric_overrides)
          +        write_report(self.summary_path, {"verdict": "GREEN", "timestamp": "2026-09-17T00:00:00Z", "metric": metric})
          +
          +    def test_custom_report_does_not_assert_the_unrelated_canonical_summary(self):
          +        result = mod.run_checks(self.report_path, 1000)
          +        self.assertTrue(result["overall_pass"], result["checks"])
          +        self.assertIsNone(result["summary_path"])
          +        self.assertIn("no charter summary asserted", named_check(result, "summary: report scope")["detail"])
          +
          +    def test_explicit_bound_summary_is_verified(self):
          +        self.summary()
          +        result = mod.run_checks(self.report_path, 1000, self.summary_path)
          +        self.assertTrue(result["overall_pass"], result["checks"])
          +        self.assertTrue(named_check(result, "summary: bound to selected report")["pass"])
          +
          +    def test_equal_metrics_do_not_replace_a_report_binding(self):
          +        self.summary(details_ref=str(self.root / "different.json"))
          +        result = mod.run_checks(self.report_path, 1000, self.summary_path)
          +        self.assertFalse(result["overall_pass"])
          +        self.assertFalse(named_check(result, "summary: bound to selected report")["pass"])
          +
          +    def test_explicit_summary_missing_or_invalid_never_passes(self):
          +        self.assertFalse(mod.run_checks(self.report_path, 1000, self.summary_path)["overall_pass"])
          +        for value in ([], None, "not an object"):
          +            write_report(self.summary_path, value)
          +            result = mod.run_checks(self.report_path, 1000, self.summary_path)
          +            self.assertFalse(result["overall_pass"])
          +            self.assertFalse(named_check(result, "summary: valid json")["pass"])
          +
          +    def test_bound_but_wrong_summary_metric_still_fails(self):
          +        self.summary(observed_pct=99.0)
          +        result = mod.run_checks(self.report_path, 1000, self.summary_path)
          +        self.assertFalse(result["overall_pass"])
          +        self.assertFalse(named_check(result, "summary: consistent with measured results")["pass"])
          +
          +    def test_canonical_report_alias_cannot_bypass_the_canonical_summary(self):
          +        alias = self.root / "canonical-alias.json"
          +        alias.symlink_to(mod.REPORT)
          +        self.summary(details_ref=str(mod.REPORT))
          +        checks = mod.check_summary(alias, self.report, None, self.summary_path)
          +        self.assertFalse(all(check["pass"] for check in checks))
          +        self.assertTrue(any(str(mod.SUMMARY) in check["detail"] for check in checks))
          +        self.assertFalse(any(check["check"] == "summary: report scope" for check in checks))
          +
          +    def test_cli_explicit_summary_checks_the_same_bound_pair(self):
          +        self.summary()
          +        command = [sys.executable, str(ROOT / "scripts/check_compatibility_corpus_pass_gate.py"),
          +                   "--report", str(self.report_path), "--summary", str(self.summary_path), "--json"]
          +        result = subprocess.run(command, capture_output=True, text=True, check=False, timeout=10)
          +        self.assertEqual(result.returncode, 0, result.stderr)
          +        self.assertEqual(json.loads(result.stdout)["summary_path"], str(self.summary_path))
          +        self.summary(details_ref="wrong-report.json")
          +        result = subprocess.run(command, capture_output=True, text=True, check=False, timeout=10)
          +        self.assertEqual(result.returncode, 1, result.stderr)
          +        self.assertFalse(json.loads(result.stdout)["overall_pass"])
          +
          +
          +class TestConstants(unittest.TestCase):
               def test_bead_section_and_default_contract_size(self):
                   self.assertEqual(mod.BEAD_ID, "bd-28sz")
          PATCH
          if ! git apply --recount --reverse --check evidence/summary-scope.patch 2>/dev/null; then
            git apply --recount --check evidence/summary-scope.patch
            git apply --recount evidence/summary-scope.patch
          fi
          git diff --check
      - name: Execute full Python and actual Rust admission regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_check_compatibility_corpus_pass_gate.py -v 2>&1 | tee evidence/python-tests.log
          bash evidence/test-rust.sh
      - name: Publish tested corrections directly to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/franken-node/src/ops/compat_corpus_run.rs scripts/check_compatibility_corpus_pass_gate.py tests/test_check_compatibility_corpus_pass_gate.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(compat): reject matching failures and bind summaries to measured reports' -m 'Require successful canonical executions in live Rust, artifact construction, and Python verification. Keep complete failures as valid FAIL evidence. Custom report validation no longer compares unrelated charter data; --summary verifies an explicitly bound pair and cannot bypass the canonical report summary. Full Python tests and actual selected Rust live/writer/digest tests passed.'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > evidence/published-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-success-admission-evidence
          retention-days: 7
          path: |
            evidence/
            crates/franken-node/src/ops/compat_corpus_run.rs
            crates/franken-node/src/ops/close_condition.rs
            scripts/check_compatibility_corpus_pass_gate.py
            tests/test_check_compatibility_corpus_pass_gate.py
