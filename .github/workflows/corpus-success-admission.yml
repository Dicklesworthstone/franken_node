name: Corpus successful execution admission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corpus-success-admission.yml'
      - 'crates/franken-node/src/ops/compat_corpus_run.rs'
      - 'crates/franken-node/src/ops/close_condition.rs'
      - 'scripts/check_compatibility_corpus_pass_gate.py'
      - 'tests/test_check_compatibility_corpus_pass_gate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the reviewed admission and summary changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for revision in 02cd2a7c98aee1bfa904b803677417bfd6d3fb1f edaec2773c4fc199d28179136eae913495067f22; do
            git fetch --depth=1 origin "$revision"
            git show "$revision:.github/workflows/corpus-success-admission.yml" > "evidence/$revision.yml"
          done
          python3 - <<'PY'
          from pathlib import Path
          def extract_step(revision, name, output):
              lines = Path(f'evidence/{revision}.yml').read_text().splitlines()
              marker = '      - name: ' + name
              assert lines.count(marker) == 1
              index = lines.index(marker) + 1
              while lines[index] != '        run: |':
                  index += 1
              index += 1
              code = []
              while index < len(lines) and (not lines[index] or lines[index].startswith('          ')):
                  code.append(lines[index][10:])
                  index += 1
              assert code and code[0] == 'set -euo pipefail'
              Path(output).write_text('\n'.join(code) + '\n')
          extract_step('02cd2a7c98aee1bfa904b803677417bfd6d3fb1f', 'Apply reviewed source corrections', 'evidence/apply-admission.sh')
          extract_step('02cd2a7c98aee1bfa904b803677417bfd6d3fb1f', 'Compile actual Rust admission, writer and digest functions', 'evidence/test-rust.sh')
          extract_step('edaec2773c4fc199d28179136eae913495067f22', 'Apply report-scoped summary validation', 'evidence/apply-summary.sh')
          # Extend the temporary harness's item selection, not production code.
          path = Path('evidence/test-rust.sh')
          text = path.read_text()
          old = '"round2", "pass_rate_pct", "aggregate",'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '"round2", "pass_rate_pct", "pass_rate_meets_floor", "aggregate",'))
          PY
          bash evidence/apply-admission.sh
          bash evidence/apply-summary.sh
      - name: Apply immutable policy and measurement corrections
        shell: bash
        run: |
          set -euo pipefail
          cat > evidence/policy.patch <<'PATCH'
