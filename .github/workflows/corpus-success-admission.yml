          hex = "0.4"
          [build-dependencies]
          syn = { version = "2", features = ["full"] }
          quote = "1"
          TOML
          cat > "$harness/lib.rs" <<'RUST'
          #![forbid(unsafe_code)]
          // Items are selected structurally from production sources. Nothing
          // inside their function bodies is rewritten, mocked or substituted.
          // Unrelated engine modules are not part of this focused compilation.
          #![allow(dead_code)]
          include!(concat!(env!("OUT_DIR"), "/selected.rs"));
          RUST
          cat > "$harness/build.rs" <<'RUST'
          use quote::ToTokens;
          use std::{collections::BTreeSet, env, fs, path::Path};
          use syn::{Item, Type};
          fn select(root: &Path, file: &str, names: &[&str], impls: &[&str]) -> String {
              let path = root.join(file);
              println!("cargo:rerun-if-changed={}", path.display());
              let source = fs::read_to_string(&path).unwrap();
              let ast = syn::parse_file(&source).unwrap();
              let mut found = BTreeSet::new();
              let mut result = String::new();
              for item in ast.items {
                  let name = match &item {
                      Item::Fn(value) => Some(value.sig.ident.to_string()),
                      Item::Struct(value) => Some(value.ident.to_string()),
                      Item::Const(value) => Some(value.ident.to_string()),
                      Item::Mod(value) => Some(value.ident.to_string()),
                      _ => None,
                  };
                  let keep_impl = match &item {
                      Item::Impl(value) => match value.self_ty.as_ref() {
                          Type::Path(path) => path.path.get_ident().is_some_and(|id|
                              impls.iter().any(|name| id == *name)),
                          _ => false,
                      },
                      _ => false,
                  };
                  if keep_impl || name.as_deref().is_some_and(|name| names.contains(&name)) {
                      if let Some(name) = name { found.insert(name); }
                      result.push_str(&item.into_token_stream().to_string());
                      result.push('\n');
                  }
              }
              assert_eq!(found, names.iter().map(|name| (*name).to_owned()).collect(), "missing production items in {file}");
              result
          }
          fn main() {
              let root = std::path::PathBuf::from(env::var_os("SOURCE_ROOT").unwrap());
              let metadata = select(&root, "ops/mod.rs", &["SOURCE_REVISION_SCHEMA", "SourceRevision",
                  "validate_full_git_sha", "embedded_source_revision"], &["SourceRevision"]);
              let corpus = select(&root, "ops/compat_corpus_run.rs", &[
                  "MAX_LEG_OUTPUT_BYTES", "DEFAULT_OVERALL_MIN_PCT", "DEFAULT_FAMILY_FLOOR_PCT", "DEFAULT_BAND_FLOORS",
                  "CaseOutcome", "RuntimeLegObservation", "LegCapture", "LockstepObservationKey",
                  "lockstep_case_passed", "passing_lockstep_observations_are_consistent", "corpus_failure_class",
                  "franken_matches_node_observation", "round2", "pass_rate_pct", "aggregate", "is_sha256_digest",
                  "runtime_observation_is_valid", "thresholds_from", "build_corpus_results_document_with_references",
                  "lockstep_pass_policy_tests"], &["LockstepObservationKey"]);
              let digest = select(&root, "ops/close_condition.rs", &[
                  "COMPATIBILITY_CORPUS_ONLINE_PROVENANCE", "COMPATIBILITY_RUNTIME_OBSERVATIONS_SCHEMA_VERSION",
                  "CCG_RESULT_DIGEST_DOMAIN", "CCG_RUNTIME_OBSERVATIONS_DIGEST_DOMAIN",
                  "compute_compatibility_corpus_result_digest", "compute_compatibility_corpus_runtime_observations_digest",
                  "get_str", "get_value"], &[]);
              let version = select(&root, "runtime/nversion_oracle.rs", &["SCHEMA_VERSION"], &[]);
              let output = format!(r#"
                  pub mod runtime {{ pub mod nversion_oracle {{ {version} }} }}
                  pub mod ops {{
                      use anyhow::{{Result, bail}};
                      use serde::{{Deserialize, Serialize}};
                      {metadata}
                      pub mod close_condition {{
                          use anyhow::{{Context, Result, bail}};
                          use serde_json::Value;
                          use sha2::{{Digest, Sha256}};
                          use std::collections::{{BTreeMap, BTreeSet}};
                          use super::compat_corpus_run::{{LockstepObservationKey, passing_lockstep_observations_are_consistent}};
                          {digest}
                      }}
                      pub mod compat_corpus_run {{
                          use anyhow::{{Context, Result, bail}};
                          use serde::Serialize;
                          use serde_json::{{Map, Value, json}};
                          use std::collections::{{BTreeMap, BTreeSet}};
                          use super::close_condition::{{COMPATIBILITY_CORPUS_ONLINE_PROVENANCE,
                              COMPATIBILITY_RUNTIME_OBSERVATIONS_SCHEMA_VERSION,
                              compute_compatibility_corpus_result_digest, compute_compatibility_corpus_runtime_observations_digest}};
                          {corpus}
                      }}
                  }}
              "#);
              fs::write(Path::new(&env::var_os("OUT_DIR").unwrap()).join("selected.rs"), &output).unwrap();
              fs::write(root.parent().unwrap().join("admission-selected-evidence.rs"), output).unwrap();
          }
          RUST
          cargo +stable test --manifest-path "$harness/Cargo.toml" --lib -- --nocapture 2>&1 | tee evidence/rust-tests.log
          cp crates/franken-node/admission-selected-evidence.rs evidence/selected.rs
          cp "$harness/Cargo.lock" evidence/Cargo.lock
          rustfmt +stable --edition 2024 --emit stdout crates/franken-node/src/ops/compat_corpus_run.rs > evidence/corpus.formatted.rs
          git rev-parse HEAD > evidence/source-revision.txt
          for path in crates/franken-node/src/ops/compat_corpus_run.rs scripts/check_compatibility_corpus_pass_gate.py tests/test_check_compatibility_corpus_pass_gate.py; do
            printf '%s ' "$path" >> evidence/source-blobs.txt
            git hash-object "$path" >> evidence/source-blobs.txt
          done
      - name: Commit tested corrections directly to main
