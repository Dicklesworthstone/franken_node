name: Release installation

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/bootstrap_source.sh'
      - 'packaging/source-siblings.tsv'
      - '.gitattributes'
      - 'tests/test_source_bootstrap.py'
      - 'tests/test_release_source_binding.py'
      - 'scripts/smoke_installed_release.py'
      - 'tests/test_release_matrix_contract.py'
      - 'rust-toolchain.toml'
      - 'tests/test_install_script.py'
      - 'tests/test_install_release_lifecycle.py'
      - '.github/workflows/dist.yml'
      - '.github/workflows/release-installation.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/bootstrap_source.sh'
      - 'packaging/source-siblings.tsv'
      - '.gitattributes'
      - 'tests/test_source_bootstrap.py'
      - 'tests/test_release_source_binding.py'
      - 'scripts/smoke_installed_release.py'
      - 'tests/test_release_matrix_contract.py'
      - 'rust-toolchain.toml'
      - 'tests/test_install_script.py'
      - 'tests/test_install_release_lifecycle.py'
      - '.github/workflows/dist.yml'
      - '.github/workflows/release-installation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      INSTALL_TEST_BASH: /bin/bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exercise archives and interrupted upgrades on the native host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git hash-object install.sh tests/test_install_release_lifecycle.py scripts/bootstrap_source.sh packaging/source-siblings.tsv > evidence/source-blobs.txt
          /bin/bash --version > evidence/bash-version.txt
          tar --version > evidence/tar-version.txt
          python3 --version > evidence/python-version.txt
          /bin/bash -n install.sh
          python3 -m unittest discover -s tests -p test_install_release_lifecycle.py -v 2>&1 | tee evidence/lifecycle-tests.log
      - name: Exercise pinned source checkout and installation with real Git
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n scripts/bootstrap_source.sh
          PATH="/bin:$PATH" python3 -m unittest discover -s tests -p test_source_bootstrap.py -v 2>&1 | tee evidence/source-bootstrap-tests.log
      - name: Exercise release source binding and original installer regressions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_release_source_binding.py -v 2>&1 | tee evidence/release-source-binding-tests.log
          python3 -m unittest discover -s tests -p test_release_matrix_contract.py -v 2>&1 | tee evidence/release-matrix-tests.log
          python3 -m unittest discover -s tests -p test_install_script.py -v 2>&1 | tee evidence/original-tests.log
      - name: Preserve exact installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-installation-${{ matrix.os }}
          path: |
            evidence/
            install.sh
            scripts/bootstrap_source.sh
            packaging/source-siblings.tsv
            tests/test_source_bootstrap.py
            tests/test_release_source_binding.py
            tests/test_install_release_lifecycle.py
          if-no-files-found: error
          retention-days: 7

  powershell-installer:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      REQUIRE_POWERSHELL_INSTALL_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exercise actual PowerShell installer transactions on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence | Out-Null
          git rev-parse HEAD | Out-File evidence/revision.txt
          Get-FileHash install.ps1,tests/test_install_release_lifecycle.py | Format-List | Out-File evidence/source-hashes.txt
          $PSVersionTable | ConvertTo-Json | Out-File evidence/pwsh-version.json
          python -m unittest discover -s tests -p test_install_release_lifecycle.py -k PowerShellInstallation -v 2>&1 | Tee-Object -FilePath evidence/powershell-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows PowerShell 5.1 native-exit handling
        shell: pwsh
        env:
          INSTALL_TEST_POWERSHELL: powershell.exe
        run: |
          python -m unittest discover -s tests -p test_install_release_lifecycle.py -k PowerShellInstallation -v 2>&1 | Tee-Object -FilePath evidence/windows-powershell-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows installer results including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-installation-windows
          path: |
            evidence/
            install.ps1
            tests/test_install_release_lifecycle.py
          if-no-files-found: error
          retention-days: 7
