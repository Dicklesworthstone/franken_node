name: franken-siblings
description: >-
  Materialize the complete pinned Cargo source set using bootstrap_source.sh.
  Preserve existing checkouts and record the product, source lock and all four
  sibling revisions in $RUNNER_TEMP/sibling-revisions.txt. The receipt records
  source inputs; successful compilation and qualification require separate proof.
runs:
  using: composite
  steps:
    # franken_engine's interpreter is a single very large compilation unit;
    # standard runners were killed mid-compile ("runner has received a
    # shutdown signal", exit 143). Add swap and cap parallel rustc jobs so the
    # peak fits.
    - name: Add swap and cap build parallelism
      shell: bash
      run: |
        set -euo pipefail
        sudo fallocate -l 16G /mnt/franken-swapfile
        sudo chmod 600 /mnt/franken-swapfile
        sudo mkswap /mnt/franken-swapfile
        sudo swapon /mnt/franken-swapfile
        free -h
        echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
    - name: Materialize pinned siblings next to the workspace
      shell: bash
      run: |
        set -euo pipefail
        bash "$GITHUB_WORKSPACE/scripts/bootstrap_source.sh" \
          --workspace "$GITHUB_WORKSPACE" \
          --engine-ref c8f5618a01141b424d1b79659615d10563e7d3c6 \
          --receipt "$RUNNER_TEMP/sibling-revisions.txt"
        cat "$RUNNER_TEMP/sibling-revisions.txt"
    - name: Retain pinned source inputs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: sibling-source-inputs-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sibling-revisions.txt
        if-no-files-found: error
    - name: Install the nightly toolchain the workspace requires
      shell: bash
      run: |
        set -euo pipefail
        channel=$(python3 -c 'import os, pathlib, tomllib; print(tomllib.loads((pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "rust-toolchain.toml").read_text())["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
        rustup default "$channel"
        rustc --version
