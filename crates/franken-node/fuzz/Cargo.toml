[package]
name = "frankenengine-node-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[package.metadata.franken_node]
canonical_fuzz_manifest = "../../fuzz/Cargo.toml"
status = "reconciled-crate-local-harnesses"
note = "Canonical 146-target suite lives at ../../fuzz/Cargo.toml; these 7 crate-local harnesses are retained per no-deletion policy and exercised by remote_capability_gate_fuzz_regression."

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.frankenengine-node]
path = ".."
default-features = false

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workflow_trace_validate"
path = "fuzz_targets/workflow_trace_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_bundle_roundtrip"
path = "fuzz_targets/replay_bundle_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_adversarial"
path = "fuzz_targets/checkpoint_adversarial.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_record_parse"
path = "fuzz_targets/checkpoint_record_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trust_card_snapshot_parse"
path = "fuzz_targets/trust_card_snapshot_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provenance_attestation_verify"
path = "fuzz_targets/provenance_attestation_verify.rs"
test = false
doc = false
bench = false
